<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" role="img" aria-labelledby="t d"><title id="t">Engine capabilities on FPGA</title><desc id="d">A grid of engines against simulated, synthesized, placed and routed, and on a board. TPU, vector and scheduler are placed and routed on ECP5; the GPU and the cached CPU are simulated and synthesized; NTT simulated; nothing has run on a board.</desc><style>
  @keyframes hy-pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
  @keyframes hy-flow  { from { stroke-dashoffset: 48 } to { stroke-dashoffset: 0 } }
  @keyframes hy-in    { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }
  .pulse { animation: hy-pulse 2.4s ease-in-out infinite; }
  .flow  { stroke-dasharray: 6 18; animation: hy-flow 1.2s linear infinite; }
  .rise  { opacity:0; animation: hy-in .6s ease-out forwards; }
  @media (prefers-reduced-motion: reduce) {
    .pulse, .flow, .rise { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style><rect width="1400" height="780" rx="18" fill="#f4f1e8"/><text x="48.0" y="64.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:26px;font-weight:750" fill="#1c1d21">CPU, GPU and TPU on FPGA: where each engine stands</text><text x="48.0" y="92.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:400" fill="#4b4d55">A filled cell is reached and names the command that shows it. An empty cell is not reached. No image has run on a board yet.</text><text x="605.0" y="140.0" text-anchor="middle" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#4b4d55">simulated</text><text x="815.0" y="140.0" text-anchor="middle" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#4b4d55">synthesized</text><text x="1025.0" y="140.0" text-anchor="middle" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#4b4d55">placed and routed</text><text x="1235.0" y="140.0" text-anchor="middle" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#4b4d55">on a board</text><rect x="40" y="160" width="1320" height="80" rx="10" fill="#fbf9f3"/><text x="60.0" y="188.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;font-weight:750" fill="#1c1d21">TPU</text><text x="60.0" y="209.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#4b4d55">4×4 INT8 systolic array, memory-fed</text><text x="60.0" y="228.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#6b6d74">ecp5-evn-tpu, ecp5-evn-mem</text><g class="rise" style="animation-delay:0.00s"><rect x="514" y="172" width="182" height="56" rx="8" fill="#6a3fcf" fill-opacity=".22" stroke="#6a3fcf"/><text x="605.0" y="200.0" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600" fill="#1c1d21">make dma</text></g><g class="rise" style="animation-delay:0.08s"><rect x="724" y="172" width="182" height="56" rx="8" fill="#9a5300" fill-opacity=".22" stroke="#9a5300"/><text x="815.0" y="200.0" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600" fill="#1c1d21">make fpga</text></g><g class="rise" style="animation-delay:0.16s"><rect x="934" y="172" width="182" height="56" rx="8" fill="#0a7488" fill-opacity=".22" stroke="#0a7488"/><text x="1025.0" y="200.0" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600" fill="#1c1d21">make fpga</text></g><rect x="1144" y="172" width="182" height="56" rx="8" fill="none" stroke="#d6cfbf" stroke-dasharray="5 5"/><rect x="40" y="250" width="1320" height="80" rx="10" fill="#fbf9f3"/><text x="60.0" y="278.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;font-weight:750" fill="#1c1d21">Vector</text><text x="60.0" y="299.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#4b4d55">4 lanes × 32-bit integer</text><text x="60.0" y="318.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#6b6d74">ecp5-evn-two</text><g class="rise" style="animation-delay:0.32s"><rect x="514" y="262" width="182" height="56" rx="8" fill="#6a3fcf" fill-opacity=".22" stroke="#6a3fcf"/><text x="605.0" y="290.0" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600" fill="#1c1d21">make dma-simd</text></g><g class="rise" style="animation-delay:0.40s"><rect x="724" y="262" width="182" height="56" rx="8" fill="#9a5300" fill-opacity=".22" stroke="#9a5300"/><text x="815.0" y="290.0" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600" fill="#1c1d21">make fpga</text></g><g class="rise" style="animation-delay:0.48s"><rect x="934" y="262" width="182" height="56" rx="8" fill="#0a7488" fill-opacity=".22" stroke="#0a7488"/><text x="1025.0" y="290.0" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600" fill="#1c1d21">make fpga</text></g><rect x="1144" y="262" width="182" height="56" rx="8" fill="none" stroke="#d6cfbf" stroke-dasharray="5 5"/><rect x="40" y="340" width="1320" height="80" rx="10" fill="#fbf9f3"/><text x="60.0" y="368.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;font-weight:750" fill="#1c1d21">GPU</text><text x="60.0" y="389.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#4b4d55">Pixelstorm SIMT, 2 SM × 4 warps × 8 lanes</text><text x="60.0" y="408.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#6b6d74">sixth slot of the system tile, in simulation; 62,625 LUT4 on ECP5</text><g class="rise" style="animation-delay:0.64s"><rect x="514" y="352" width="182" height="56" rx="8" fill="#6a3fcf" fill-opacity=".22" stroke="#6a3fcf"/><text x="605.0" y="380.0" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600" fill="#1c1d21">make systile-gpu</text></g><g class="rise" style="animation-delay:0.72s"><rect x="724" y="352" width="182" height="56" rx="8" fill="#9a5300" fill-opacity=".22" stroke="#9a5300"/><text x="815.0" y="380.0" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600" fill="#1c1d21">make gpu</text></g><rect x="934" y="352" width="182" height="56" rx="8" fill="none" stroke="#d6cfbf" stroke-dasharray="5 5"/><rect x="1144" y="352" width="182" height="56" rx="8" fill="none" stroke="#d6cfbf" stroke-dasharray="5 5"/><rect x="40" y="430" width="1320" height="80" rx="10" fill="#fbf9f3"/><text x="60.0" y="458.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;font-weight:750" fill="#1c1d21">NTT</text><text x="60.0" y="479.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#4b4d55">Barrett butterflies, 3 moduli</text><text x="60.0" y="498.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#6b6d74">not in an FPGA image yet</text><g class="rise" style="animation-delay:0.96s"><rect x="514" y="442" width="182" height="56" rx="8" fill="#6a3fcf" fill-opacity=".22" stroke="#6a3fcf"/><text x="605.0" y="470.0" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600" fill="#1c1d21">make ntt-moduli</text></g><rect x="724" y="442" width="182" height="56" rx="8" fill="none" stroke="#d6cfbf" stroke-dasharray="5 5"/><rect x="934" y="442" width="182" height="56" rx="8" fill="none" stroke="#d6cfbf" stroke-dasharray="5 5"/><rect x="1144" y="442" width="182" height="56" rx="8" fill="none" stroke="#d6cfbf" stroke-dasharray="5 5"/><rect x="40" y="520" width="1320" height="80" rx="10" fill="#fbf9f3"/><text x="60.0" y="548.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;font-weight:750" fill="#1c1d21">CPU</text><text x="60.0" y="569.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#4b4d55">Sixfold RV64IM + Zba/Zbb/Zbs + Zknh</text><text x="60.0" y="588.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#6b6d74">the system tile's CPU slot; the cached build synthesizes for ECP5 (make cpu-cached checks it)</text><g class="rise" style="animation-delay:1.28s"><rect x="514" y="532" width="182" height="56" rx="8" fill="#6a3fcf" fill-opacity=".22" stroke="#6a3fcf"/><text x="605.0" y="560.0" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600" fill="#1c1d21">make systile-cpu</text></g><g class="rise" style="animation-delay:1.36s"><rect x="724" y="532" width="182" height="56" rx="8" fill="#9a5300" fill-opacity=".22" stroke="#9a5300"/><text x="815.0" y="560.0" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600" fill="#1c1d21">make cpu-synth</text></g><rect x="934" y="532" width="182" height="56" rx="8" fill="none" stroke="#d6cfbf" stroke-dasharray="5 5"/><rect x="1144" y="532" width="182" height="56" rx="8" fill="none" stroke="#d6cfbf" stroke-dasharray="5 5"/><rect x="40" y="610" width="1320" height="80" rx="10" fill="#fbf9f3"/><text x="60.0" y="638.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;font-weight:750" fill="#1c1d21">Scheduler</text><text x="60.0" y="659.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#4b4d55">cost model, calibration, tags</text><text x="60.0" y="678.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#6b6d74">also hardened as the Tiny Tapeout tile</text><g class="rise" style="animation-delay:1.60s"><rect x="514" y="622" width="182" height="56" rx="8" fill="#6a3fcf" fill-opacity=".22" stroke="#6a3fcf"/><text x="605.0" y="650.0" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600" fill="#1c1d21">make systile</text></g><g class="rise" style="animation-delay:1.68s"><rect x="724" y="622" width="182" height="56" rx="8" fill="#9a5300" fill-opacity=".22" stroke="#9a5300"/><text x="815.0" y="650.0" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600" fill="#1c1d21">make fpga</text></g><g class="rise" style="animation-delay:1.76s"><rect x="934" y="622" width="182" height="56" rx="8" fill="#0a7488" fill-opacity=".22" stroke="#0a7488"/><text x="1025.0" y="650.0" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600" fill="#1c1d21">make fpga</text></g><rect x="1144" y="622" width="182" height="56" rx="8" fill="none" stroke="#d6cfbf" stroke-dasharray="5 5"/><text x="48.0" y="750.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#6b6d74">From docs/verification/capability-matrix.md. 'make fpga' places and routes the ECP5 images; 'make systile-gpu' schedules a real GPU kernel on the six-slot system tile (simulation, not the chip top).</text></svg>
