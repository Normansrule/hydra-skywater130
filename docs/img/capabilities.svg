ize:12.5px;font-weight:600" fill="#eef2f7">make gpu</text></g><g class="rise" style="animation-delay:0.72s"><rect x="724" y="352" width="182" height="56" rx="8" fill="#5b9cf5" fill-opacity=".22" stroke="#5b9cf5"/><text x="815.0" y="380.0" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600" fill="#eef2f7">make gpu</text></g><rect x="934" y="352" width="182" height="56" rx="8" fill="none" stroke="#2a3a52" stroke-dasharray="5 5"/><rect x="1144" y="352" width="182" height="56" rx="8" fill="none" stroke="#2a3a52" stroke-dasharray="5 5"/><rect x="40" y="430" width="1320" height="80" rx="10" fill="#172131"/><text x="60.0" y="458.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;font-weight:750" fill="#eef2f7">NTT</text><text x="60.0" y="479.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#a9b6c6">Barrett butterflies, 3 moduli</text><text x="60.0" y="498.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#6f7f95">not in an FPGA image yet</text><g class="rise" style="animation-delay:0.96s"><rect x="514" y="442" width="182" height="56" rx="8" fill="#3dbb8a" fill-opacity=".22" stroke="#3dbb8a"/><text x="605.0" y="470.0" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600" fill="#eef2f7">make ntt-moduli</text></g><rect x="724" y="442" width="182" height="56" rx="8" fill="none" stroke="#2a3a52" stroke-dasharray="5 5"/><rect x="934" y="442" width="182" height="56" rx="8" fill="none" stroke="#2a3a52" stroke-dasharray="5 5"/><rect x="1144" y="442" width="182" height="56" rx="8" fill="none" stroke="#2a3a52" stroke-dasharray="5 5"/><rect x="40" y="520" width="1320" height