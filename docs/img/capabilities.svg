<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" role="img" aria-labelledby="t d"><title id="t">Engine capabilities on FPGA</title><desc id="d">A grid of engines against simulated, synthesized, placed and routed, and on a board. TPU, vector and scheduler are placed and routed on ECP5; the GPU is simulated and synthesized; NTT simulated; the CPU not integrated; nothing has run on a board.</desc><style>
  @keyframes hy-pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
  @keyframes hy-flow  { from { stroke-dashoffset: 48 } to { stroke-dashoffset: 0 } }
  @keyframes hy-in    { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }
  .pulse { animation: hy-pulse 2.4s ease-in-out infinite; }
  .flow  { stroke-dasharray: 6 18; animation: hy-flow 1.2s linear infinite; }
  .rise  { opacity:0; animation: hy-in .6s ease-out forwards; }
  @media (prefers-reduced-motion: reduce) {
    .pulse, .flow, .rise { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style><rect width="1400" height="780" rx="18" fill="#0f1622"/><text x="48.0" y="64.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:26px;font-weight:750" fill="#eef2f7">CPU, GPU and TPU on FPGA: where each engine stands</text><text x="48.0" y="92.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:400" fill="#a9b6c6">A filled cell is reached and names the command that shows it. An empty cell is not reached. No image has run on a board yet.</text><text x="605.0" y="140.0" text-anchor="middle" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#a9b6c6">simulated</text><text x="815.0" y="140.0" text-anchor="middle" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#a9b6c6">synthesized</text><text x="1025.0" y="140.0" text-anchor="middle" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#a9b6c6">placed and routed</text><text x="1235.0" y="140.0" text-anchor="middle" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#a9b6c6">on a board</text><rect x="40" y="160" width="1320" height="80" rx="10" fill="#172131"/><text x="60.0" y="188.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;font-weight:750" fill="#eef2f7">TPU</text><text x="60.0" y="209.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#a9b6c6">4×4 INT8 systolic array, memory-fed</text><text x="60.0" y="228.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Robo