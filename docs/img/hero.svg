<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d"><title id="t">HYDRA-130</title><desc id="d">An area chart, not a floorplan: each block drawn to its synthesized standard-cell area, with an illustrative dispatch from the dispatcher to the systolic array. Sign-off facts are the Tiny Tapeout tile's: 66 ns at every corner, with design rules, layout versus schematic and antenna clean. No full chip has been placed or routed.</desc><style>
  .pulse { offset-path: path("M58,176 H690 V200.4 H805.0"); offset-distance: 100%; opacity: 0; }
  .sweep { opacity: 0; animation: sw 6s linear infinite; }
  .s1 { animation-delay: 0s; } .s2 { animation-delay: .6s; }
  .s3 { animation-delay: 1.2s; } .s4 { animation-delay: 1.8s; }
  .route { stroke-dashoffset: 0; animation: rt 6s ease-in-out infinite; }
  .win   { opacity: 1; animation: wn 6s ease-in-out infinite; }
  .tag   { opacity: 1; }
  @keyframes sw { 0% { opacity: 0 } 3% { opacity: 1 } 9% { opacity: 1 } 12% { opacity: 0 } 100% { opacity: 0 } }
  @keyframes rt { 0%, 40% { stroke-dashoffset: 400 } 55%, 100% { stroke-dashoffset: 0 } }
  @keyframes wn { 0%, 52% { opacity: .15 } 60%, 92% { opacity: 1 } 100% { opacity: .15 } }
  @media (prefers-reduced-motion: reduce) {
    .sweep { animation: none; opacity: 0; }
    .route { animation: none; stroke-dashoffset: 0; }
    .win   { animation: none; opacity: 1; }
  }
</style><defs><pattern id="rows" width="8" height="7" patternUnits="userSpaceOnUse"><rect width="8" height="3" fill="#ffffff" opacity="0.06"/></pattern><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern></defs><rect width="1200" height="600" rx="18" fill="#17202c"/><rect width="1200" height="600" rx="18" fill="url(#grid)"/><rect x="690" y="80" width="430" height="430" rx="4" fill="#1e2938"/><g><title>Dispatcher: 144,505 µm² of standard cells</title><rect x="698.5" y="88.5" width="213.1" height="223.7" rx="3" fill="#5b9cf5" fill-opacity=".20" stroke="#5b9cf5" stroke-opacity=".9" stroke-width="1.3"/><rect x="698.5" y="88.5" width="213.1" height="223.7" rx="3" fill="url(#rows)"/><text x="708.5" y="110.5" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:650" fill="#eef2f7">Dispatcher</text><text x="708.5" y="128.5" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px" fill="#a9b6c6">145k µm²</text></g><g><title>Systolic array: 119,562 µm² of standard cells</title><rect x="698.5" y="317.2" width="213.1" height="184.3" rx="3" fill="#3dbb8a" fill-opacity=".20" stroke="#3dbb8a" stroke-opacity=".9" stroke-width="1.3"/><rect x="698.5" y="317.2" width="213.1" height="184.3" rx="3" fill="url(#rows)"/><text x="708.5" y="339.2" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:650" fill="#eef2f7">Systolic array</text><text x="708.5" y="357.2" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px" fill="#a9b6c6">120k µm²</text></g><g><title>Vector unit: 96,967 µm² of standard cells</title><rect x="916.6" y="88.5" width="194.9" height="162.4" rx="3" fill="#3dbb8a" fill-opacity=".20" stroke="#3dbb8a" stroke-opacity=".9" stroke-width="1.3"/><rect x="916.6" y="88.5" width="194.9" height="162.4" rx="3" fill="url(#rows)"/><text x="926.6" y="110.5" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:650" fill="#eef2f7">Vector unit</text><text x="926.6" y="128.5" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px" fill="#a9b6c6">97k µm²</text></g><g><title>Transform engine: 70,524 µm² of standard cells</title><rect x="916.6" y="255.9" width="194.9" height="116.8" rx="3" fill="#3dbb8a" fill-opacity=".20" stroke="#3dbb8a" stroke-opacity=".9" stroke-width="1.3"/><rect x="916.6" y="255.9" width="194.9" height="116.8" rx="3" fill="url(#rows)"/><text x="926.6" y="277.9" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:650" fill="#eef2f7">Transform engine</text><text x="926.6" y="295.9" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px" fill="#a9b6c6">71k µm²</text></g><g><title>SHA-256: 65,727 µm² of standard cells</title><rect x="916.6" y="377.7" width="171.2" height="123.8" rx="3" fill="#e061b0" fill-opacity=".20" stroke="#e061b0" stroke-opacity=".9" stroke-width="1.3"/><rect x="916.6" y="377.7" width="171.2" height="123.8" rx="3" fill="url(#rows)"/><text x="926.6" y="399.7" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:650" fill="#eef2f7">SHA-256</text><text x="926.6" y="417.7" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px" fill="#a9b6c6">66k µm²</text></g><g><title>Test port + streamer: 8,860 µm² of standard cells</title><rect x="1092.8" y="377.7" width="18.7" height="123.8" rx="3" fill="#7d8ea3" fill-opacity=".20" stroke="#7d8ea3" stroke-opacity=".9" stroke-width="1.3"/><rect x="1092.8" y="377.7" width="18.7" height="123.8" rx="3" fill="url(#rows)"/></g><rect class="sweep s1" x="916.6" y="88.5" width="194.9" height="162.4" rx="3" fill="none" stroke="#eef2f7" stroke-width="2.4"/><rect class="sweep s2" x="698.5" y="317.2" width="213.1" height="184.3" rx="3" fill="none" stroke="#eef2f7" stroke-width="2.4"/><rect class="sweep s3" x="916.6" y="255.9" width="194.9" height="116.8" rx="3" fill="none" stroke="#eef2f7" stroke-width="2.4"/><rect class="sweep s4" x="916.6" y="377.7" width="171.2" height="123.8" rx="3" fill="none" stroke="#eef2f7" stroke-width="2.4"/><path class="route" d="M805.0,200.4 H805.0 V409.4 H805.0" fill="none" stroke="#e061b0" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="400"/><rect class="win" x="698.5" y="317.2" width="213.1" height="184.3" rx="3" fill="#3dbb8a" fill-opacity=".28" stroke="#3dbb8a" stroke-width="2.6"/><text x="56" y="150" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:78px;font-weight:800;letter-spacing:-2px" fill="#eef2f7">HYDRA-130</text><path d="M58,176 H690 V200.4 H805.0" fill="none" stroke="#e061b0" stroke-opacity=".75" stroke-width="2.4" stroke-linejoin="round"/><text x="58" y="222" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:23px" fill="#a9b6c6">Adaptive scheduling and accelerator research</text><text x="58" y="252" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:23px" fill="#a9b6c6">for FPGA and SkyWater&#8217;s 130 nm process.</text><rect x="58" y="309" width="14" height="14" rx="2" fill="#5b9cf5"/><text x="86" y="322" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:650" fill="#eef2f7">Tile timing</text><text x="226" y="322" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px" fill="#a9b6c6">66 ns, all nine corners, +10.06 ns (v3.8 harden)</text><rect x="58" y="345" width="14" height="14" rx="2" fill="#d6a93c"/><text x="86" y="358" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:650" fill="#eef2f7">Tile layout</text><text x="226" y="358" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px" fill="#a9b6c6">DRC, LVS, antenna clean; 1,164 slew warnings</text><rect x="58" y="381" width="14" height="14" rx="2" fill="#3dbb8a"/><text x="86" y="394" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:650" fill="#eef2f7">Gate level</text><text x="226" y="394" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px" fill="#a9b6c6">21 of 21 tile tests, hardened netlist</text><rect x="58" y="417" width="14" height="14" rx="2" fill="#3dbb8a"/><text x="86" y="430" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:650" fill="#eef2f7">Proofs</text><text x="226" y="430" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px" fill="#a9b6c6">22 proof tasks, run by make verify</text><rect x="58" y="453" width="14" height="14" rx="2" fill="#3dbb8a"/><text x="86" y="466" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:650" fill="#eef2f7">GPU engine</text><text x="226" y="466" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px" fill="#a9b6c6">14 kernels match Pixelstorm's own model</text><rect x="58" y="489" width="14" height="14" rx="2" fill="#e061b0"/><text x="86" y="502" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:650" fill="#eef2f7">Security IP</text><text x="226" y="502" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px" fill="#a9b6c6">vault, SHA-256, measurement: simulated only</text><text x="58" y="546" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px" fill="#a9b6c6" opacity=".85">Area chart, not a floorplan: separately synthesized cell area, 0.51 mm² in all.</text><text x="58" y="568" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px" fill="#a9b6c6" opacity=".85">No full chip has been placed or routed. Vault, mailbox and PCR not yet measured.</text><text class="tag" x="905.0" y="580" text-anchor="middle" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px" fill="#a9b6c6">illustrative: an 8×8×8 matrix multiply goes to the systolic array</text></svg>
