="3" fill="url(#rows)"/><text x="708.5" y="339.2" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:650" fill="#eef2f7">Systolic array</text><text x="708.5" y="357.2" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px" fill="#a9b6c6">120k µm²</text></g><g><title>Vector unit: 96,967 µm² of standard cells</title><rect x="916.6" y="88.5" width="194.9" height="162.4" rx="3" fill="#3dbb8a" fill-opacity=".20" stroke="#3dbb8a" stroke-opacity=".9" stroke-width="1.3"/><rect x="916.6" y="88.5" width="194.9" height="162.4" rx="3" fill="url(#rows)"/><text x="926.6" y="110.5" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:650" fill="#eef2f7">Vector unit</text><text x="926.6" y="128.5" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px" fill="#a9b6c6">97k µm²</text></g><g><title>Transform engine: 70,524 µm² of standard cells</title><rect x="916.6" y="255.9" width="194.9" height="116.8" rx="3" fill="#3dbb8a" fill-opacity=".20" stroke="#3dbb8a" stroke-opacity=".9" stroke-width="1.3"/><rect x="916.6" y="255.9" width="194.9" height="116.8" rx="3" fill="url(#rows)"/><text x="926.6" y="277.9" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:650" fill="#eef2f7">Transform engine</text><text x="926.6" y="295.9" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px" fill="#a9b6c6">71k µm²</text></g><g><title>SHA-256: 65,727 µm² of standard cells</title><rect x="916.6" y="377.7" width="171.2" height="123.8" rx="3" fill="#e061b0" fill-opacity=".20" stroke="#e061b0" stroke-opacity=".9" stroke-width="1.3"/><rect x="916.6" y="377.7" width="171.2" height="123.8" rx="3" fill="url(#rows)"/><text x="926.6" y="399.7" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:650" fill="#eef2f7">SHA-256</text><text x="926.6" y="417.7" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px" fill="#a9b6c6">66k µm²</text></g><g><title>Test port + streamer: 8,860 µm² of standard cells</title><rect x="1092.8" y="377.7" width="18.7" height="123.8" rx="3" fill="#7d8ea3" fill-opacity=".20" stroke="#7d8ea3" stroke-opacity=".9" stroke-width="1.3"/><rect x="1092.8" y="377.7" width="18.7" height="123.8" rx="3" fill="url(#rows)"/></g><rect class="sweep s1" x="916.6" y="88.5" width="194.9" height="162.4" rx="3" fill="none" stroke="#eef2f7" stroke-width="2.4"/><rect class="sweep s2" x="698.5" y="317.2" width="213.1" height="184.3" rx="3" fill="none" stroke="#eef2f7" stroke-width="2.4"/><rect class="sweep s3" x="916.6" y="255.9" width="194.9" height="116.8" rx="3" fill="none" stroke="#eef2f7" stroke-width="2.4"/><rect class="sweep s4" x="916.6" y="377.7" width="171.2" height="123.8" rx="3" fill="none" stroke="#eef2f7" stroke-width="2.4"/><path class="route" d="M805.0,200.4 H805.0 V409.4 H805.0" fill="none" stroke="#e061b0" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="400"/><rect class="win" x="698.5" y="317.2" width="213.1" height="184.3" rx="3" fill="#3dbb8a" fill-opacity=".28" stroke="#3dbb8a" stroke-width="2.6"/><text x="56" y="150" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:78px;font-weight:800;letter-spacing:-2px" fill="#eef2f7">HYDRA-130</text><path d="M58,176 H620 V159.0 H669 M678,159.0 H690 V200.4 H805.0" fill="none" stroke="#e061b0" stroke-opacity=".75" stroke-width="2.4" stroke-linejoin="round"/><circle class="pulse" r="6.5" fill="#eef2f7" stroke="#e061b0" stroke-width="3"/><text x="58" y="222" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:23px" fill="#a9b6c6">A dispatcher chip that measures its own engines,</text><text x="58" y="252" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:23px" fill="#a9b6c6">open source, for SkyWater&#8217;s 130 nm process.</text><rect x="58" y="317" width="14" height="14" rx="2" fill="#5b9cf5"/><text x="86" y="330" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:650" fill="#eef2f7">Timing</text><text x="226" y="330" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px" fill="#a9b6c6">66 ns, all nine corners, +2.20 ns</text><rect x="58" y="359" width="14" height="14" rx="2" fill="#d6a93c"/><text x="86" y="372" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:650" fill="#eef2f7">Layout</text><text x="226" y="372" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px" fill="#a9b6c6">design rules, LVS and antenna all clean</text><rect x="58" y="401" width="14" height="14" rx="2" fill="#3dbb8a"/><text x="86" y="414" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:650" fill="#eef2f7">Gate level</text><text x="226" y="414" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px" fill="#a9b6c6">v3 pending; v2 17 of 17 tests on the hardened netlist</text><rect x="58" y="443" width="14" height="14" rx="2" fill="#3dbb8a"/><text x="86" y="456" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:650" fill="#eef2f7">Proofs</text><text x="226" y="456" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px" fill="#a9b6c6">15 modules proved, 6 results unbounded</text><rect x="58" y="485" width="14" height="14" rx="2" fill="#e061b0"/><text x="86" y="498" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:650" fill="#eef2f7">Root of trust</text><text x="226" y="498" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px" fill="#a9b6c6">write-only keys, images measured in hardware</text><text x="58" y="546" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px" fill="#a9b6c6" opacity=".85">Blocks drawn to measured cell area, 0.51 mm² in all.</text><text x="58" y="568" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px" fill="#a9b6c6" opacity=".85">Key vault, mailbox and measurement register are not yet measured.</text><text class="tag" x="905.0" y="580" text-anchor="middle" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px" fill="#a9b6c6">an 8×8×8 matrix multiply goes to the systolic array</text></svg>
