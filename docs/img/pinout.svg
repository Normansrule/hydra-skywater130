<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 682" width="1500" height="682" role="img" aria-label="HYDRA-130 · Tiny Tapeout pinout"><rect x="1" y="1" width="1498" height="680" rx="14" fill="#ffffff" stroke="#d6dce5"/><text x="24" y="34" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#111827">HYDRA-130 · Tiny Tapeout pinout</text><text x="24" y="58" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px" fill="#5b6576">The research tile (v3) has one interface: an SPI register map on three pins, and status summaries on the outputs. The HYDRA-130 chip keeps the v1 serial pins as well.</text><rect x="560" y="96" width="380" height="342" rx="12" fill="#f3f6fa" stroke="#111827" stroke-width="1.6"/><text x="750.0" y="260" text-anchor="middle" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:21px;font-weight:700" fill="#111827">tt_um_hydra_mom</text><text x="750.0" y="284" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px" fill="#5b6576">3x4 tiles · sky130 · 15 MHz</text><line x1="526" y1="120.0" x2="560" y2="120.0" stroke="#0f766e" stroke-width="2.2"/><text x="572" y="124.0" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:700" fill="#0f766e">ui[0]</text><text x="516" y="117.0" text-anchor="end" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px" fill="#111827">SCK - SPI clock, mode 0, at most clk/8</text><line x1="940" y1="120.0" x2="974" y2="120.0" stroke="#b45309" stroke-width="2.2"/><text x="928" y="124.0" text-anchor="end" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:700" fill="#b45309">uo[0]</text><text x="984" y="117.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px" fill="#111827">CIPO - SPI data out</text><line x1="526" y1="162.0" x2="560" y2="162.0" stroke="#0f766e" stroke-width="2.2"/><text x="572" y="166.0" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:700" fill="#0f766e">ui[1]</text><text x="516" y="159.0" text-anchor="end" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px" fill="#111827">COPI - SPI data in</text><line x1="940" y1="162.0" x2="974" y2="162.0" stroke="#b45309" stroke-width="2.2"/><text x="928" y="166.0" text-anchor="end" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:700" fill="#b45309">uo[1]</text><text x="984" y="159.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px" fill="#111827">irq - a sticky error flag is set</text><line x1="526" y1="204.0" x2="560" y2="204.0" stroke="#0f766e" stroke-width="2.2"/><text x="572" y="208.0" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:700" fill="#0f766e">ui[2]</text><text x="516" y="201.0" text-anchor="end" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px" fill="#111827">CSn - SPI chip select, active low</text><line x1="940" y1="204.0" x2="974" y2="204.0" stroke="#b45309" stroke-width="2.2"/><text x="928" y="208.0" text-anchor="end" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:700" fill="#b45309">uo[2]</text><text x="984" y="201.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px" fill="#111827">engine[0] - engine of the last dispatch</text><line x1="526" y1="246.0" x2="560" y2="246.0" stroke="#0f766e" stroke-width="2.2"/><text x