<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" role="img" aria-label="How a dispatch decision is made"><rect x="1" y="1" width="978" height="418" rx="14" fill="#ffffff" stroke="#d6dce5"/><text x="24" y="34" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#111827">How a dispatch decision is made</text><text x="24" y="56" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px" fill="#5b6576">One cost engine evaluates each compute engine in turn — two cycles each, because its second</text><text x="24" y="74" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px" fill="#5b6576">stage reads the calibration factor, an input that must stay put — then the cheapest wins.</text><line x1="144" y1="198" x2="214" y2="198" stroke="#d6dce5" stroke-width="1.4"/><rect x="24" y="170" width="120" height="56" rx="9" fill="#f3f6fa" stroke="#d6dce5"/><text x="84" y="196" text-anchor="middle" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600" fill="#111827">descriptor</text><text x="84" y="213" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px" fill="#5b6576">8×8×8 GEMM</text><circle r="6" fill="#0f766e"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.08;0.09;1" dur="7.2s" repeatCount="indefinite"/><animateMotion path="M 144 198 L 214 198" dur="7.2s" keyPoints="0;1;1" keyTimes="0;0.08;1" calcMode="linear" repeatCount="indefinite"/></circle><rect x="214" y="150" width="170" height="96" rx="11" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"/><text x="299" y="186" text-anchor="middle" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#111827">cost engine</text><text