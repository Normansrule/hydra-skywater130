<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" role="img" aria-labelledby="t d"><title id="t">HYDRA-130 connections</title><desc id="d">Host over serial or JTAG into one bridge, then the SPI register map, the scheduler, the crossbar and six engine slots of the system tile (simulation); scratchpad banks feed the engines and are loaded by the host. The OpenFrame chip top holds the scheduler alone.</desc><style>
  @keyframes hy-pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
  @keyframes hy-flow  { from { stroke-dashoffset: 48 } to { stroke-dashoffset: 0 } }
  @keyframes hy-in    { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }
  .pulse { animation: hy-pulse 2.4s ease-in-out infinite; }
  .flow  { stroke-dasharray: 6 18; animation: hy-flow 1.2s linear infinite; }
  .rise  { opacity:0; animation: hy-in .6s ease-out forwards; }
  @media (prefers-reduced-motion: reduce) {
    .pulse, .flow, .rise { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style><rect width="1400" height="720" rx="18" fill="#121417"/><text x="48.0" y="64.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:26px;font-weight:750" fill="#ece8de">What connects to what</text><text x="48.0" y="92.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:400" fill="#b9b5ab">A job goes in from either host, is costed by the scheduler, runs on the cheapest eligible engine, and its completion recalibrates the model. Six slots on the chip, five on the tile.</text><rect x="48" y="150" width="210" height="96" rx="10" fill="#4cc6de" fill-opacity=".13" stroke="#4cc6de" stroke-width="1.8"/><text x="62.0" y="176.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#ece8de">PC over serial</text><text x="62.0" y="196.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#b9b5ab">UART 115200 8N1</text><text x="62.0" y="234.0" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400" fill="#4cc6de">simulated, P&amp;R</text><rect x="48" y="290" width="210" height="96" rx="10" fill="#4cc6de" fill-opacity=".13" stroke="#4cc6de" stroke-width="1.8"/><text x="62.0" y="316.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#ece8de">PC over JTAG</text><text x="62.0" y="336.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#b9b5ab">probe on Pmod JA</text><text x="62.0" y="374.0" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400" fill="#4cc6de">simulated (Basys 3)</text><rect x="320" y="210" width="200" height="120" rx="10" fill="#efac46" fill-opacity=".13" stroke="#efac46" stroke-width="1.8"/><text x="334.0" y="236.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#ece8de">Bridge</text><text x="334.0" y="256.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#b9b5ab">one command set,</text><text x="334.0" y="318.0" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400" fill="#efac46">simulated, P&amp;R</text><text x="334.0" y="274.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#b9b5ab">two independent hosts</text><rect x="580" y="210" width="200" height="120" rx="10" fill="#efac46" fill-opacity=".13" stroke="#efac46" stroke-width="1.8"/><text x="594.0" y="236.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#ece8de">SPI register map</text><text x="594.0" y="256.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#b9b5ab">descriptor, GO, results</text><text x="594.0" y="318.0" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400" fill="#efac46">hardened (tile)</text><rect x="840" y="150" width="230" height="240" rx="10" fill="#efac46" fill-opacity=".13" stroke="#efac46" stroke-width="1.8"/><text x="854.0" y="176.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#ece8de">Scheduler (MOM)</text><text x="854.0" y="196.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#b9b5ab">features → cost engine</text><text x="854.0" y="378.0" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400" fill="#efac46">hardened (tile v3.10)</text><text x="856.0" y="222.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#ece8de">• roofline cost per engine</text><text x="856.0" y="248.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#ece8de">• eligibility before cost</text><text x="856.0" y="274.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#ece8de">• pick the cheapest</text><text x="856.0" y="300.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#ece8de">• calibrate on completion</text><rect x="840" y="450" width="230" height="96" rx="10" fill="#efac46" fill-opacity=".13" stroke="#efac46" stroke-width="1.8"/><text x="854.0" y="476.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#ece8de">Crossbar</text><text x="854.0" y="496.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#b9b5ab">dispatch and completion</text><text x="854.0" y="534.0" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400" fill="#efac46">simulated, proved</text><rect x="1140" y="126" width="214" height="80" rx="10" fill="#ef7fa0" fill-opacity=".13" stroke="#ef7fa0" stroke-width="1.8"/><text x="1154.0" y="152.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#ece8de">CPU (system tile)</text><text x="1154.0" y="172.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#b9b5ab">Sixfold RV64, 6 stages</text><text x="1154.0" y="194.0" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400" fill="#ef7fa0">scheduled, simulated</text><rect x="1140" y="218" width="214" height="80" rx="10" fill="#ac8ef6" fill-opacity=".13" stroke="#ac8ef6" stroke-width="1.8"/><text x="1154.0" y="244.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#ece8de">Vector unit</text><text x="1154.0" y="264.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#b9b5ab">4 lanes × 32-bit</text><text x="1154.0" y="286.0" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400" fill="#ac8ef6">simulated, P&amp;R</text><rect x="1140" y="310" width="214" height="80" rx="10" fill="#ac8ef6" fill-opacity=".13" stroke="#ac8ef6" stroke-width="1.8"/><text x="1154.0" y="336.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#ece8de">TPU</text><text x="1154.0" y="356.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#b9b5ab">4×4 INT8 systolic + memory</text><text x="1154.0" y="378.0" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400" fill="#ac8ef6">simulated, P&amp;R</text><rect x="1140" y="402" width="214" height="80" rx="10" fill="#ac8ef6" fill-opacity=".13" stroke="#ac8ef6" stroke-width="1.8"/><text x="1154.0" y="428.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#ece8de">NTT</text><text x="1154.0" y="448.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#b9b5ab">Barrett butterflies</text><text x="1154.0" y="470.0" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400" fill="#ac8ef6">simulated</text><rect x="1140" y="494" width="214" height="80" rx="10" fill="#8d8b85" fill-opacity=".13" stroke="#8d8b85" stroke-width="1.8"/><text x="1154.0" y="520.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#ece8de">Crypto slot</text><text x="1154.0" y="540.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#b9b5ab">latency model</text><text x="1154.0" y="562.0" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400" fill="#8d8b85">model only</text><rect x="1140" y="586" width="214" height="80" rx="10" fill="#ef7fa0" fill-opacity=".13" stroke="#ef7fa0" stroke-width="1.8"/><text x="1154.0" y="612.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#ece8de">GPU (system tile)</text><text x="1154.0" y="632.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#b9b5ab">Pixelstorm 2 SM × 4 × 8</text><text x="1154.0" y="654.0" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400" fill="#ef7fa0">scheduled, simulated</text><rect x="580" y="450" width="200" height="96" rx="10" fill="#ac8ef6" fill-opacity=".13" stroke="#ac8ef6" stroke-width="1.8"/><text x="594.0" y="476.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#ece8de">Scratchpad banks</text><text x="594.0" y="496.0" text-anchor="start" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#b9b5ab">operands and results</text><text x="594.0" y="534.0" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400" fill="#ac8ef6">simulated, P&amp;R</text><path d="M258,198 H290 V250 H320" fill="none" stroke="#363c47" stroke-width="2.4"/><path class="flow" d="M258,198 H290 V250 H320" fill="none" stroke="#efac46" stroke-width="2.4" stroke-opacity=".9"/><path d="M258,338 H290 V290 H320" fill="none" stroke="#363c47" stroke-width="2.4"/><path class="flow" d="M258,338 H290 V290 H320" fill="none" stroke="#efac46" stroke-width="2.4" stroke-opacity=".9"/><path d="M520,270 H580" fill="none" stroke="#363c47" stroke-width="2.4"/><path class="flow" d="M520,270 H580" fill="none" stroke="#efac46" stroke-width="2.4" stroke-opacity=".9"/><path d="M780,270 H840" fill="none" stroke="#363c47" stroke-width="2.4"/><path class="flow" d="M780,270 H840" fill="none" stroke="#efac46" stroke-width="2.4" stroke-opacity=".9"/><path d="M955,390 V450" fill="none" stroke="#363c47" stroke-width="2.4"/><path class="flow" d="M955,390 V450" fill="none" stroke="#efac46" stroke-width="2.4" stroke-opacity=".9"/><path d="