<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Standard cell area by block"><style>.node rect{fill:#f3f6fa;stroke:#d6dce5;stroke-width:1.5}.n-label{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600;fill:#111827;text-anchor:middle}.n-sub{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#5b6576;text-anchor:middle}.edge{fill:none;stroke:#9aa6b6;stroke-width:1.5}.edge-label{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;fill:#5b6576;text-anchor:middle}.bar rect{fill:#0f766e}.b-name{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600;fill:#111827;text-anchor:end}.b-val{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#5b6576}</style><rect width="100%" height="100%" fill="#ffffff"/>
