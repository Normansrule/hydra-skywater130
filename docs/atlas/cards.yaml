  outputs:
  - desc: data out, changes on FALLING tck
    name: tdo
    width: 1
  - desc: drive enable, high only while shifting
    name: tdo_oe
    width: 1
  - desc: value shifted in, presented at UPDATE_DR
    name: user_dr
    width: 40
  - desc: one-TCK pulse after UPDATE_DR with IR=USER
