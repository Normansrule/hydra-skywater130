  - dbg/rtl/hydra_jtag_tap.sv:173-176 - negedge TDO
  - dbg/formal/jtag_tap.sby:18-25 - multiclock, bmc depth 10
  clock_reset: 'TCK domain only, rising edge for state/IR/DR (lines 113, 122, 144), falling edge for tdo/tdo_oe
    (lines 173-176). NO reset input: state powers up arbitrary; 5 TCKs with TMS=1 reach Test-Logic-Reset (lines
    109-113). IR loads IDCODE while in TLR (lines 123-124).'
