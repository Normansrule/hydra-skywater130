calibrate:
  _from: mom_calibrate
  citations:
  - mom/rtl/mom_calibrate.sv:110-112 - ALPHA, K_MIN, K_MAX
  - mom/rtl/mom_calibrate.sv:157-160 - read port with unity fallback
  - mom/rtl/mom_calibrate.sv:172-185 - index guard, 34-bit t_cal, sign
  - mom/rtl/mom_calibrate.sv:193-220 - step and clamps
  - mom/rtl/mom_calibrate.sv:224 - update conditions
  - mom/rtl/mom_calibrate.sv:226-243 - state update
  - mom/rtl/mom_calibrate.sv:320 - assert on undeclared 'step'
  clock_reset: clk rising; async active-low reset sets every k to 64, upd_count 0, last_dir 0 (226-232). reset_factors
    (synchronous, priority over updates) sets k = 64 and upd_count = 0 but leaves last_dir (233-237).
  evidence:
  - target: cost-cal
    what: 'MODEL-02: full-width comparison and out-of-range index guard (tb_cost_cal)'
  - target: mom-mutate
    what: MODEL-02 x2 reverted -> cost-cal must fail
  - target: tile
    what: test_reg_completion_calibration_and_fence (count, freeze, reset), test_reg_calibration_closes_the_loop
      (slow TPU completions move LARGE off the TPU)
  - target: system
    what: loop closes with engine completions only (tb_mom_system)
  - target: systile
    what: slow TPU profile moves the decision; documents that it does not come back (E7)
  example: 'VERIFIED-SIM: SIMD/GEMM, k = 64, t_pred 27, t_meas 1288: t_cal = (27*64) >> 6 = 27; 1288 > 27 -> too_slow;
    step = 64>>4 = 4;

    k = 68; CALUPD 0 -> 1.

    '
  expert:
    assumptions:
    - The FORMAL block (249-322) is not run by any Makefile target, and line 320 asserts on a signal 'step' that
      is never declared (only the function step_of exists), so it would not elaborate with FORMAL defined.
    params:
    - meaning: engines
      name: NENG
      value: 5 or 6
    - meaning: step = max(1, k >> 4)
      name: ALPHA
      value: 4
    - meaning: lower clamp, 0.0625
      name: K_MIN
      value: 4
    - meaning: upper clamp, 3.98
      name: K_MAX
      value: 255
    registers:
    - cite: mom/rtl/mom_calibrate.sv:146-148,226-230
      name: k[NENG][9]
      value: 8-bit Q2.6, reset 64
    timing:
    - Read port combinational (157-160). Update lands on the edge where upd_valid is high, i.e. two cycles after
      the completion pulse reaches the scoreboard (scoreboard 249 + this 238).
  failure: Update skipped when frozen, when t_predicted = 0, or when the engine/op class index is out of range (224,
    172). Equal measured and calibrated time leaves k unchanged (220). Clamped to [4, 255] (206, 214). Only one
    update per cycle; the scoreboard can produce at most one completion per cycle anyway.
  inputs:
  - desc: 'CTRL.CAL_FREEZE: no updates'
    name: freeze
    width: 1
  - desc: 'CTRL.CAL_RESET (level): all k = 64, count = 0'
    name: reset_factors
    width: 1
  - desc: op class of the descriptor in the features register
    name: rd_opclass
    width: 4
  - desc: scoreboard cal_valid
    name: upd_valid
    width: 1
  - desc: engine
    name: upd_engine
    width: 3
  - desc: op class
    name: upd_opclass
    width: 4
  - desc: cycles from dispatch to completion
    name: upd_t_measured
    width: 32
  - desc: uncalibrated t_pred stored at dispatch
    name: upd_t_predicted
    width: 32
  job: 'Keeps an 8-bit Q2.6 correction factor k for every (engine, op class) pair, serves the factors for the descriptor
    being costed, and on each completion moves the matching k one proportional step up or down by the sign of (measured
    - calibrated prediction): sign least-mean-squares with no divider.'
  outputs:
  - desc: k[e][rd_opclass], 64 if op class >= 9
    name: rd_k
    width: NENG x 8
  - desc: CALUPD
    name: upd_count
    width: 16
  - desc: 1 = last step raised k (unused)
    name: last_dir
    width: 1
cost:
  _from: mom_cost_engine
  citations:
  - mom/rtl/mom_cost_engine.sv:140-156 - capable and valid
  - mom/rtl/mom_cost_engine.sv:166-172 - log-domain roofline
  - mom/rtl/mom_cost_engine.sv:180-188 - compute cycles and clamp
  - mom/rtl/mom_cost_engine.sv:198-206 - DMA term, setup shift
  - mom/rtl/mom_cost_engine.sv:230-235 - 40-bit sum, t_pred saturation
  - mom/rtl/mom_cost_engine.sv:278-303 - normalised calibration multiply
  - mom/rtl/mom_cost_engine.sv:342-369 - energy terms
  - mom/rtl/mom_cost_engine.sv:391-403 - stage-A register
  - mom/rtl/mom_cost_engine.sv:408-421 - objective and invalid cost
  clock_reset: clk rising; async active-low reset clears the stage-A register t_pred_q, e_ops_q, e_mem_q, valid_q,
    capable_q, lambda_en_q (lines 391-394); stage B is combinational from it.
  evidence:
  - target: cost-cal
    what: 'tb_cost_cal: calibrated product vs exact floor(t_pred*k/64) at every exponent boundary and every k; MODEL-01'
  - target: cost-mux
    what: shared build decisions == parallel build decisions
  - target: cost-mux-mutate
    what: 5 sequencer breaks (one known-equivalent) must change decisions
  - target: mom-mutate
    what: MODEL-01 normalisation shift reverted -> cost-cal must fail
  example: "GEMM INT8 4x4x4, bytes 48, LAT_BALANCED, PWR_BALANCED, GLOBAL = {4,12,8}, k = 64, queue 0 (log2_w 7,\
    \ log2_i 2):\n  t_move = 48 >> 4 = 3;  e_mem = (48*12) >> 8 = 576 >> 8 = 2;  e_ops = eps_op >> 1 (net shift\
    \ 7+0-8 = -1)\n  CPU : bw_bound 2+2=4, p_att min(4,0)=0, t_comp 2^7=128, t_pred 128+0+3 = 131, J = 131+40+2\
    \ = 173\n  SIMD: bw_bound 6, p_att 3, t_comp 2^4=16, t_pred 16+8+3 = 27, J = 27+10+2 = 39   <- winner\n  TPU\
    \ : bw_bound 7, p_att 7, t_comp 2^0=1, t_pred 1+64+3 = 68, J = 68+1+2 = 71\n  NTT, CRYPTO: dtype INT8 not in\
    \ mask -> invalid, cost 0xFFFFFFFF\n  margin 71 - 39 = 32.  VERIFIED-SIM (tile: engine 1, margin 32; scoreboard\
    \ saw t_pred 27).\nGEMM INT8 8x8x8, bytes 192 (log2_w 10, log2_i 3): t_move 12, e_mem 2304>>8 = 9, e_ops = eps<<2\n\
    \  CPU 1036+320+9 = 1365; SIMD 148+80+9 = 237; TPU (8+64+12)+8+9 = 101 <- winner; margin 136. VERIFIED-SIM (from\
    \ reset).\n  After one SIMD/GEMM calibration step k = 68: SIMD t_cal = (148*68)>>6 = 157, J = 246, margin 145.\
    \ VERIFIED-SIM.\n"
  expert:
    assumptions:
    - 'Calibration multiply uses a byte-normalised 16-bit mantissa: e = 0 below 2^16 (exact), 8 below 2^24, 16 above;
      result at most 1/256 low (278-303).'
    - lat_hint scales t_setup by x1 (THROUGHPUT, BALANCED), x2 (LOW), x4 (REALTIME) (204-206).
    - J = floor(k*T_hat/64) [normalised] + ((eps_op << log2_w << lambda_log2) >> e_shift) + (((bytes*eps_mem) <<
      lambda_log2) >> e_shift), energy terms zero when lambda enable = 0 (342-369, 408-412).
    params:
    - meaning: waveform naming only (426)
      name: ENGINE_ID
      value: engine_e, unused in the body
    registers: []
    timing:
    - 'Two stages: stage A (capability, roofline, t_pred, raw energy) registered on adv; stage B (calibration multiply,
      energy sum, saturation) combinational from it (387-421). In the shared top each engine therefore takes 2 cycles:
      phase 0 advances stage A, phase 1 reads stage B with the same engine''s k_cal still presented (mom_top.sv:65-71,
      236-287).'
  failure: 'Never stalls by itself; stage A only updates on adv (395). Saturation: log2 compute time > 31 -> COST_SAT
    (187-188); 40-bit sum clamps t_pred (230-235); calibrated product overflow -> COST_SAT (302-303); energy overflow
    -> COST_SAT (353, 410); final J overflow -> COST_SAT (417-418). An engine with !valid presents all-ones (415-416).  Up
    to v3.8 a descriptor whose only capable engine was full when costed was held for ever; since v3.10 the selector
    reads the scoreboard''s live full flags, so it dispatches once that engine drains (test_full_only_engine_recovers).'
  inputs:
  - desc: 'advance stage A (shared mode: eval_busy && !phase)'
    name: adv
    width: 1
  - desc: from features
    name: log2_w
    width: 8
  - desc: descriptor bytes, linear
    name: bytes_q
    width: 24
  - desc: from features
    name: log2_i
    width: 9 signed
  - desc: descriptor fields
    name: dtype/op_class/lat_hint
    width: 3/4/2
  - desc: '{enable, log2 lambda} from pwr_hint'
    name: lambda_sh
    width: 4
  - desc: engine row
    name: param
    width: 43
  - desc: Q2.6 calibration factor (consumed in stage B)
    name: k_cal
    width: 8
  - desc: outstanding jobs on this engine
    name: queue_depth
    width: 8
  - desc: queue_depth >= QMAX
    name: engine_busy_full
    width: 1
  - desc: GLOBAL
    name: bw_dma_log2/eps_mem/e_shift
    width: 4/4/4
  job: For one engine's parameter row, computes predicted cycles (roofline compute time + setup + operand transfer
    + queue depth), applies that engine's calibration factor, adds a power-hint-weighted energy term, and reports
    the cost plus whether the engine is capable (can ever run it) and valid (can take it now). Two internal pipeline
    stages.
  outputs:
  - desc: J; 0xFFFFFFFF when !valid; 0xFFFF0000 on overflow
    name: cost
    width: 32
  - desc: uncalibrated predicted cycles (stored by the scoreboard)
    name: t_pred
    width: 32
  - desc: capable && !full
    name: valid
    width: 1
  - desc: dtype and op-class masks both pass
    name: capable
    width: 1
