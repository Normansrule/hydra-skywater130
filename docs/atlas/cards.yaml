    extend again with meas=32 bytes of 0xFF -> 2f3eababb5511c0da2d2bdb7b9462792df1400e0c69f99c42c4039ccec9ea72d
    (pcr_meas.txt:2, pcr_exp.txt:2). extend_count = 2.'
  expert:
    assumptions:
    - pcr.sby prove depth 10 (k-induction), cover depth 300 (pcr.sby:10-14) over the REAL hydra_sha256 core (Makefile:170)
    - 'Proved: PCR and extend_count change only when the previous state was FINISH (lines 174, 178); extend while
      busy does not disturb meas_q (line 182); busy == (st != IDLE) invariant (line 167)'
    - Reset assumed in first cycle (line 159)
    params: []
    registers:
    - Block 0 = PCR words 0..7 then meas words 0..7 (lines 82-84); block 1 = 0x80000000, 13 zeros, 512 (lines 86-88)
    timing: FSM IDLE->INIT->LOAD0 (16)->RUN0->LOAD1 (16)->RUN1->FINISH (lines 66-68, 103-149). Each RUN waits for
      one 65-cycle compression plus a registered go; roughly 170 clocks per extend by reading the FSM (not measured
      by a bench I read).
  failure: extend while busy is ignored (only IDLE samples it, lines 103-107; proved line 182). No error output.
    extend_count wraps after 65535 extends (lines 53, 145).
  inputs:
  - desc: clock
    name: clk
    width: 1
  - desc: active-low async reset; the only way to clear the PCR
    name: rst_n
    width: 1
  - desc: 'pulse: fold meas in (only sampled in IDLE)'
    name: extend
    width: 1
  - desc: the measurement (a digest)
    name: meas
    width: 256
  job: 'A 256-bit Platform Configuration Register (PCR) with no write port: the only operation is EXTEND, PCR <-
    SHA-256(PCR || measurement), using a fixed two-block padding the module supplies itself.'
  outputs:
  - desc: extend in progress
    name: busy
    width: 1
  - desc: one-cycle pulse when PCR updated
    name: done
    width: 1
  - desc: current value
    name: pcr
    width: 256
  - desc: number of extends since reset (wraps at 65536)
    name: extend_count
    width: 16
  security_bounds:
    claimed: No write port; the register moves only at the end of an extend (proved).
    not_claimed: 'Not authenticated boot or attestation: no immutable root key, signer or verifier (docs/security/threat-model.md:58).
