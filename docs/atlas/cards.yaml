dma:
  _from: hydra_dma_gemm
  citations:
  - mem/rtl/hydra_dma_gemm.sv:93 - states IDLE PRIME STREAM DRAIN
  - mem/rtl/hydra_dma_gemm.sv:146-149 - go, xfer, bank_ok, capture
  - mem/rtl/hydra_dma_gemm.sv:165-172 - holding register
  - mem/rtl/hydra_dma_gemm.sv:202-216 - result count and outputs
  clock_reset: posedge clk, async active-low rst_n clears state, counters and holding register (hydra_dma_gemm.sv:160-163,
    203-206).
  evidence:
  - target: dma
    what: SymbiYosys proof of hydra_dma_gemm (Makefile:425-432; properties hydra_dma_gemm.sv:230-279)
  - target: dma-mutate
    what: 26 mutations across the streamer and three wrappers (mem/formal/mutate_dma.py:20-97)
  example: 'Verified (tb_c_tdma, base_a 10, base_b 20, base_c 100, K = 4): accept +0 (go), PRIME +1 (address 10
    presented),

    STREAM +2 captures mem[10], words offered +3, +4, +5, +6 (0aff0501, f6fe0602, 14fd0703, ecfc0804 from A;

    ff020001, 02fd0100, 0001fe04, 010003fb from B); results written C[100..115] at +14..+32.

    '
  expert:
    assumptions:
    - power-up in reset (formal initial assume, hydra_dma_gemm.sv:227)
    memory_map: 'Descriptor reserved bits: wd[12:3] base_a, wd[22:13] base_b, wd[32:23] base_c (hydra_dma_gemm.sv:19-24).
      Twiddle bank shares the A pointer (hydra_dma_gemm.sv:72-75,158).'
    params:
    - meaning: operand address bits
      name: AW
      value: 10
    - meaning: word / group width (128 for SIMD and NTT)
      name: DW
      value: 32
    - meaning: result address bits
      name: CAW
      value: AW
    - meaning: counters
      name: CNTW
      value: 16
    timing: First operand offered at +3 after start; then one group per cycle if the engine is ready (the bank re-reads
      on a stall). DRAIN to IDLE after the last result.
  failure: 'start while not IDLE is ignored (hydra_dma_gemm.sv:146) - wrappers must not accept while busy.

    k_slices = 0 stays IDLE (hydra_dma_gemm.sv:182). Stalls: when the held word is not taken the same

    address is re-presented so nothing is lost (hydra_dma_gemm.sv:98-106,149). Results are written

    unconditionally on res_valid (no back-pressure to the engine). DRAIN exits only when res_seen >= n_q

    and no result is arriving (hydra_dma_gemm.sv:193,208). No range check: the wrappers refuse jobs that

    would run past a bank.

    '
  inputs:
  - desc: taken only when IDLE
    name: start
    width: 1
  - desc: bases
    name: base_a, base_b
    width: AW
  - desc: result base
    name: base_c
    width: CAW
  - desc: groups to stream
    name: k_slices
    width: 16
  - desc: results to wait for
    name: n_results
    width: 16
  - desc: bank outputs
    name: a_rdata, b_rdata, w_rdata
    width: DW
  - desc: engine took the word
    name: op_ready
    width: 1
  - desc: engine result
    name: res_valid
    width: 1
  - desc: result
    name: res_data
    width: 32
  job: Direct Memory Access (DMA) streamer. On start it reads one word per operand bank per group from consecutive
    addresses, presents them to the engine with valid/ready through a one-word holding register, and writes every
    engine result to consecutive C addresses; it stays busy until the expected number of results has been written.
  outputs:
  - desc: not IDLE
    name: busy
    width: 1
  - desc: w_addr = a_addr
    name: a_addr, b_addr, w_addr
    width: AW
  - desc: result write
    name: c_addr, c_we, c_wdata
    width: CAW/1/32
  - desc: holding register valid in STREAM
    name: op_valid
    width: 1
  - desc: held words
    name: op_a, op_b, op_w
    width: DW
