  inputs:
  - desc: probe clock (its own domain)
    name: tck
    width: 1
  - desc: mode select
    name: tms
    width: 1
  - desc: data in
    name: tdi
    width: 1
  - desc: word captured into the user DR at CAPTURE_DR
    name: user_capture
    width: DRW=40
  job: The 16-state Joint Test Action Group (JTAG) controller on its own probe clock TCK, with a 4-bit instruction
