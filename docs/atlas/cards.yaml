  example: 'GEMM 4x4x4, bytes 48: lg_m = lg_n = lg_k = flog2(4) = 2 -> log2_w = 2+2+2+1 = 7 (line 140); log2_q =
    flog2(48) = 5;

    log2_i = 7 - 5 = 2.

    GEMM 8x8x8, bytes 192: log2_w = 3+3+3+1 = 10; log2_q = flog2(192) = 7; log2_i = 3.

    GEMM INT32 32x32x64, bytes 0: log2_w = 5+5+6+1 = 17; log2_q = 0; log2_i = 17.

    (All three feed decisions VERIFIED-SIM below.)

    '
  expert:
    assumptions:
    - 'W formulas (lines 132-156): SCALAR/ELEMENT/REDUCE lg_m; GEMM/CONV2D lg_m+lg_n+lg_k+1; FFT 2+lg_n+flog2(lg_n);
      NTT lg_n+flog2(lg_n)+1; CIPHER/HASH lg_q. HASH is NOT ceil(bytes/64)*CPBLK as the header (line 53) says; it
      is log2(bytes).'
