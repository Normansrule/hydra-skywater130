  - tt/tile/src/rtl/hydra_tt_regs.sv:300-315 - result capture, sticky flags, clear
  - tt/tile/src/rtl/hydra_tt_regs.sv:322-331 - outputs to the MOM
  - tt/tile/src/rtl/hydra_tt_regs.sv:337-340 - STATUS layout
  - tt/tile/src/rtl/hydra_tt_regs.sv:369-388 - read path, snapshot, status byte during command
  - tt/tile/src/rtl/hydra_tt_regs.sv:394-407 - irq and log-scale margin nibble
  - mom/rtl/hydra_tt_regs.sv:76-80,162 - HOST_COMP parameter (chip copy)
  - mom/rtl/hydra_tt_regs.sv:134,150,306,361 - LASTWD (chip copy)
  clock_reset: 'clk rising edge; asynchronous active-low reset (tile: rst_n_sync from hydra_rst_sync, 2 stages,
    tt_um_hydra_mom.sv:140-143). Reset values (tile copy lines 216-227): all frame state 0, wd_q = 0, WD_OK = 0,
    CTRL bits 0, FENCE = 0, GLOBAL = {4, 12, 8} = 0x4C8, pending/wd_block 0, all sticky flags 0, RESULT fields 0;
    snap_q = 0 (381-383). Chip copy adds r_lastwd = 0 (mom/rtl/hydra_tt_regs.sv:229).'
  evidence:
  - target: tile
    what: '21 cocotb tests: id/defaults, torn frames, abort at every byte boundary, WD-while-pending refusal, HOLD
      back-pressure, PARAM retune and lock, fence, calibration counter, pin summaries, margin log-scaling, reserved
      0x07'
  - target: tile (mutate via `make mutate` -> test/mutate_sim.py)
    what: 17 mutations, 12 of them in this file (PARAM_LOCK, frame length, GO on torn WD, HOLD, freeze wiring, PARAM
      engine field, status byte, read order, GO never retired, clear-sticky, margin log, WD while pending); the
      others hit the SPI target, the scoreboard (3) and the wrapper pins
  - target: mom-mutate
    what: RTL-04 snapshot removed -> systile must fail; RTL-08 HOST_COMP flipped -> systile must fail; RTL-02 disp_fire
      -> systile must fail
  - target: systile
    what: chip copy with HOST_COMP = 0 over SPI against latency-model engines
  - target: sky130
    what: chip copy inside hydra_mom_pins through the OpenFrame pads
  example: 'VERIFIED-SIM on the tile: write WD (TX 01 30 A0 00 80 00 80 00 80 00 06 00 00 00 00 00 00), GO (TX 03
    01), read

    RESULT (TX 86 00 00 00 00 00 00 -> RX D8 20 00 00 00 20 00).

    RESULT = 0x20_0000_0020_00: byte0 0x20 = {engine 001, tag 0000, 0}; margin = 0x00000020 = 32; err_tag 0x00.

    STATUS read after the dispatch: RX 10 D8 40 -> STATUS 0xD840 = READY | ANY_BUSY | WD_OK | DISPATCHED | FENCE_BUSY

    (FENCE = 0 points at tag 0, which is busy). The leading 0x10 is STATUS[15:8] captured at frame start, while
    the

    descriptor was still being costed (READY low, DISPATCHED not yet set).

    '
  expert:
    assumptions:
    - On the tile HOLD is the whole dispatch handshake (disp_fire = disp_valid & ~HOLD, tt_um_hydra_mom.sv:194);
      in the system tile the crossbar owns it and HOLD gates engine readiness (hydra_sys_tile.sv:215,337).
    - csr_priv is tied 1; PARAM_LOCK is the only protection of the parameter rows (326).
    params:
    - meaning: tag count, reported in INFO and width of obs_tag_busy
      name: NTAG
      value: 8 default; 4 on the tile (tt_um_hydra_mom.sv:146,188); 8 in hydra_mom_pins and hydra_sys_tile
    - meaning: whether COMP is writable
      name: HOST_COMP
      value: chip copy only; default 1; 0 in hydra_sys_tile.sv:190
    - meaning: ID register
      name: ID_VALUE
      value: 0x48594D33 'HYM3' (tile, line 140); 0x48594D32 'HYM2' (chip, mom/rtl/hydra_tt_regs.sv:139)
    registers:
    - access: RO
      addr: 0
      cite: tile hydra_tt_regs.sv:140,144,353
      fields: '[31:0] = 0x48594D33 (tile) / 0x48594D32 (chip)'
      name: ID
      reset: constant
      side_effects: none; write -> FRAME_ERR (not writable, tile 161-163)
      width: 4 bytes
    - access: RW
      addr: 1
      cite: tile hydra_tt_regs.sv:145,243-253,266,354
      fields: '[127:0] work descriptor (mom_pkg work_desc_t), first data byte = bits 127:120'
      name: WD
      reset: '0'
      side_effects: command byte (write) clears WD_OK, or if a GO is pending blocks the frame (243-246); data bytes
        shift into wd_q MSB first (251); commit with exactly 16 bytes sets WD_OK (266). Read returns live wd_q,
        not a snapshot (354, 380)
      width: 16 bytes
    - access: RW
      addr: 2
      cite: tile hydra_tt_regs.sv:146,267-272,324,330-331,355; mom/rtl/mom_calibrate.sv:233-237
      fields: '[0] HOLD (disp_accept = ~HOLD); [1] CAL_FREEZE; [2] CAL_RESET (level: while set every k is forced
        to 64 and CALUPD to 0); [3] PARAM_LOCK (OR-sticky until reset); [7:4] ignored, read 0'
      name: CTRL
      reset: '0x00'
      side_effects: HOLD stops dispatch (mom_top uses disp_accept in disp_valid to the scoreboard and c_ready);
        a write with bit3 = 0 cannot clear PARAM_LOCK
      width: 1 byte
    - access: WO
      addr: 3
      cite: tile hydra_tt_regs.sv:147,211-213,291-297,312-315
      fields: '[0] GO; [1] CLEAR_STICKY; [7:2] ignored'
      name: ACTION
      reset: n/a (reads 0)
      side_effects: 'GO: if WD_OK and nothing pending, pending_q = 1 (wd_valid) and DISPATCHED/UNSUPPORTED are cleared;
        otherwise GO_ERR. CLEAR_STICKY clears DISPATCHED, UNSUPPORTED, STALE, FRAME_ERR, GO_ERR (and so IRQ); it
        is applied after the result updates in the same cycle, so it wins'
      width: 1 byte
    - access: WO
      addr: 4
      cite: tile hydra_tt_regs.sv:148,273-276; mom/rtl/hydra_tt_regs.sv:162
      fields: '[3:0] tag to complete; [7:4] ignored'
      name: COMP
      reset: n/a (reads 0)
      side_effects: 'one-cycle comp_valid with comp_tag the cycle after commit (273-276, 229). Chip copy with HOST_COMP=0:
        not writable -> FRAME_ERR'
      width: 1 byte
    - access: RO
      addr: 5
      cite: tile hydra_tt_regs.sv:337-340,356,386
      fields: '[15] READY (wd_ready) [14] ANY_BUSY [13] PENDING [12] WD_OK [11] DISPATCHED* [10] UNSUPPORTED* [9]
        STALE* [8] FRAME_ERR* [7] GO_ERR* [6] FENCE_BUSY [5] PARAM_LOCK [4] HOLD [3] CAL_FREEZE [2] CAL_RESET [1:0]
        0   (* sticky)'
      name: STATUS
      reset: 'reads 0x8000 when idle after reset (VERIFIED-SIM: RX 80 80 00)'
      side_effects: none; STATUS[15:8] is also sent during every command byte
      width: 2 bytes
    - access: RO
      addr: 6
      cite: tile hydra_tt_regs.sv:150,300-309,357,380-387
      fields: '[47:45] engine, [44:41] tag, [40] 0, [39:8] margin (32-bit), [7:0] err_tag'
      name: RESULT
      reset: '0'
      side_effects: engine/tag/margin captured on disp_fire (300-305), err_tag on err_unsupported (306-309); read
        as one snapshot (byte 0 live, bytes 1..5 from snap_q captured on the same tx_load, 380-387)
      width: 6 bytes
    - access: 'tile: none; chip: RO'
      addr: 7
      cite: tile hydra_tt_regs.sv:67,157,363; mom/rtl/hydra_tt_regs.sv:150,306,361
      fields: 'chip: [127:0] descriptor as dispatched (disp_wd)'
      name: reserved (tile) / LASTWD (chip)
      reset: '0'
      side_effects: 'tile: reads 0x00, write -> FRAME_ERR (VERIFIED-SIM: RX D8 00 00). chip: captured on dispatch,
        not snapshotted (read with HOLD set)'
      width: 'tile: reg_len 0; chip: 16 bytes'
    - access: RO
      addr: 8
      cite: tile hydra_tt_regs.sv:151,358; mom/rtl/mom_calibrate.sv:231,237,240
      fields: '[15:0] calibration update count (wraps at 16 bits)'
      name: CALUPD
      reset: 0; also held at 0 while CAL_RESET
      side_effects: none
      width: 2 bytes
    - access: RO
      addr: 9
      cite: tile hydra_tt_regs.sv:152,342-346,359
      fields: '[NTAG-1:0] tag busy bitmap, upper bits 0 (tile: [3:0])'
      name: BUSY
      reset: '0'
      side_effects: none
      width: 2 bytes
    - access: RW
      addr: 10
      cite: tile hydra_tt_regs.sv:153,277,325,360; mom/rtl/mom_scoreboard.sv:260
      fields: '[3:0] fence tag; [7:4] ignored, read 0'
      name: FENCE
      reset: '0'
      side_effects: STATUS.FENCE_BUSY = busy[FENCE]; a tag >= NTAG reads not busy
      width: 1 byte
    - access: WO
      addr: 11
      cite: tile hydra_tt_regs.sv:154,279-283; mom/rtl/mom_param_rom.sv:152-153
      fields: '[47:46] ignored, [45:43] engine, [42:0] parameter row (layout in mom_pkg card)'
      name: PARAM
      reset: n/a (reads 0)
      side_effects: commit raises csr_wr for one cycle (unless PARAM_LOCK, then silently dropped); mom_param_rom
        writes the row next edge, and ignores engine >= NENG
      width: 6 bytes
    - access: RW
      addr: 12
      cite: tile hydra_tt_regs.sv:155,222,278,327-329,361
      fields: '[15:12] ignored/0, [11:8] bw_dma_log2, [7:4] eps_mem, [3:0] e_shift'
      name: GLOBAL
      reset: '0x04C8 (VERIFIED-SIM: RX D8 04 C8)'
      side_effects: feeds every cost evaluation directly
      width: 2 bytes
    - access: RO
      addr: 13
      cite: tile hydra_tt_regs.sv:139,156,362
      fields: '[7:0] NTAG (4 on the tile, 8 on hydra_mom_pins)'
      name: INFO
      reset: constant
      side_effects: write -> FRAME_ERR
      width: 1 byte
    - access: none
      addr: 0x0E-0x7F
      cite: tile hydra_tt_regs.sv:157,363
      fields: '-'
      name: unmapped
      reset: '-'
      side_effects: read 0x00; write -> FRAME_ERR
      width: reg_len 0
    timing:
    - Commit happens in the cs_end cycle (205-208); the effect (e.g. pending_q, comp_valid, csr_wr) is visible the
      next cycle.
    - 'GO: cs_end at cycle C -> descriptor accepted by mom_features at C+1 -> dispatch (disp_fire) at C+13 on the
      tile (VERIFIED-SIM: cs_end 2528, accept 2529, dispatch 2541).'
    - 'COMP: cs_end at C -> comp_valid at C+1 -> scoreboard cal_valid at C+2 -> k written at that edge (VERIFIED-SIM:
      3828/3829/3830).'
    - Data byte k of a read goes out on the tx_load after byte k's predecessor; byte 0 of the value immediately
      follows the command byte (comment 367-368).
  failure: '- Write commits only on cs_end and only if: a command byte arrived, rw = 0, the address is writable,
    exactly reg_len data bytes arrived, and the frame was not blocked (tile 205-208). Otherwise nothing changes
    and FRAME_ERR (STATUS bit 8) is set (259-263). VERIFIED-SIM: TX 02 00 01 (2 bytes to 1-byte CTRL) -> STATUS
    0x9900, CTRL still 0.

    - WD exception: bytes shift straight into wd_q (251), and the command byte clears WD_OK (245), so a torn WD
    frame leaves a half-shifted wd_q with WD_OK = 0; GO then raises GO_ERR (297) instead of dispatching. VERIFIED-SIM:
    15-byte WD -> STATUS 0xC140 (WD_OK clear, FRAME_ERR), then GO -> 0xC1C0 (GO_ERR).

    - WD write while a GO is pending: wd_block_q set at the command byte (244), bytes not shifted (251), frame refused
    with FRAME_ERR (207, 262); the pending descriptor is untouched.

    - GO with WD_OK = 0 or a GO already pending -> GO_ERR, nothing presented (213, 297). GO does NOT clear WD_OK,
    so repeated GOs dispatch the same descriptor again (each takes a new tag).

    - Reads never set FRAME_ERR, whatever the address or length; bytes past the register length and unmapped addresses
    read 0x00 (369-376, 386-388, 363).

    - PARAM written while PARAM_LOCK is set: the frame is "good" (no FRAME_ERR) but csr_wr is not raised, so the
    write is silently dropped (279).

    - Chip copy with HOST_COMP = 0 (system tile): COMP is not writable, so a COMP write is FRAME_ERR (mom/rtl/hydra_tt_regs.sv:162).

    - A CS pulse with no complete byte is not an error (have_cmd = 0 -> frame_bad = 0, 207).

    '
  inputs:
  - desc: byte stream from hydra_tt_spi
    name: cs_start/cs_end/rx_valid/rx_byte/rx_index/tx_load
    width: 1/1/1/8/5/1
  - desc: mom_top can take a descriptor (mom_features in_ready)
    name: wd_ready
    width: 1
  - desc: 'a dispatch was taken this cycle (tile: disp_valid & ~HOLD, tt_um_hydra_mom.sv:194)'
    name: disp_fire
    width: 1
  - desc: engine of the dispatch
    name: disp_engine
    width: 3
  - desc: tag allocated
    name: disp_tag
    width: 4
  - desc: chip copy only (LASTWD)
    name: disp_wd
    width: 128
  - desc: busy[FENCE] from the scoreboard
    name: fence_busy
    width: 1
  - desc: 'pulse: descriptor retired, no engine capable'
    name: err_unsupported
    width: 1
  - desc: descriptor tag field of the unsupported descriptor
    name: err_tag
    width: 8
  - desc: 'pulse: completion for a tag not in flight'
    name: err_stale_comp
    width: 1
  - desc: runner-up cost minus winner cost
    name: obs_margin
    width: 32
  - desc: calibration update counter
    name: obs_cal_updates
    width: 16
  - desc: tag busy vector
    name: obs_tag_busy
    width: NTAG
  job: Turns SPI frames into register reads and whole-frame-or-nothing register writes, stages the 128-bit descriptor,
    holds the GO request until the dispatcher takes it, records the dispatch result and sticky status flags, and
    drives every mom_top control input (back-pressure, completion, fence, parameter-row writes, platform constants,
    calibration control).
  outputs:
  - desc: next CIPO byte
    name: tx_byte
    width: 8
  - desc: = pending_q
    name: wd_valid
    width: 1
  - desc: = wd_q (descriptor register)
    name: wd
    width: 128
  - desc: = ~HOLD
    name: disp_accept
    width: 1
  - desc: one-cycle completion pulse from COMP
    name: comp_valid/comp_tag
    width: 1/4
  - desc: FENCE register
    name: fence_tag
    width: 4
  - desc: parameter-row write pulse; csr_priv tied 1
    name: csr_wr/csr_priv/csr_engine/csr_data
    width: 1/1/3/43
  - desc: GLOBAL fields
    name: csr_bw_dma_log2/csr_eps_mem/csr_e_shift
    width: 4/4/4
  - desc: CTRL bits 1 and 2 (levels)
    name: csr_cal_freeze/csr_cal_reset
    width: 1/1
  - desc: OR of the five sticky flags (incl. dispatched)
    name: irq
    width: 1
  - desc: pin summaries
    name: last_engine/disp_sticky/last_tag/margin_nib
    width: 3/1/4/4
rst_sync:
  _cites_current: true
  _from: hydra_rst_sync
  citations:
  - common/rtl/hydra_rst_sync.sv:16-59 - module (v3.10 form)
  - common/rtl/hydra_rst_sync.sv:33-41 - the stages and rel_q
  - common/rtl/hydra_rst_sync.sv:45-58 - formal
  - reports/fpga-harden-2026-10-17/tile-netlist-equivalence-rstsync.log.gz - the tile netlist before and after,
    proved equivalent
  clock_reset: sync_q[STAGES-2:0] and rel_q are cleared asynchronously by arst_n; on each clk edge sync_q shifts
    in a 1 and rel_q takes the last stage (lines 33-41); rst_n = rel_q unless scan_mode (line 43). Since v3.10 the
    released reset is its own flop, rel_q, so Verilator 5.05x no longer reports the vector as flopped both synchronously
    and asynchronously; same flops, same behaviour.
  evidence:
  - target: make padmux
    what: also runs hydra_rst_sync.sby prove (Makefile:219-220)
  - target: make rst-sync-copy
    what: tile copy byte-identical (Makefile:96-99)
  - target: make mutate
    what: mutate_targets.py (Makefile:559-560)
  example: 'arst_n falls -> rst_n = 0 at once. arst_n rises -> edge 1: sync_q = 1; edge 2: rel_q = 1, so rst_n =
    1 after the 2nd rising edge (STAGES = 2).'
  expert:
    assumptions:
    - hydra_rst_sync.sby prove, reading the .sv directly
    - Assumes reset at first step and scan_mode=0 (lines 37-38); asserts !arst_n -> !rst_n (line 40) and rst_n ->
      at least STAGES clean edges (lines 42-45)
    - 'Mutations: ''release after one edge'' and ''asynchronous release'' must fail the proof (common/formal/mutate_targets.py:53-62)'
    params:
    - meaning: synchroniser depth (line 17)
      name: STAGES
      value: 2
    registers: []
    timing: Release latency = STAGES rising edges after arst_n rises.
  failure: If arst_n releases inside the setup/hold window, flop 0 may go metastable; flop 1 gives it one cycle
    to resolve (design intent; not provable in simulation or this formal model).
  inputs:
  - desc: destination clock
    name: clk
    width: 1
  - desc: async active-low (AND of all sources)
    name: arst_n
    width: 1
  - desc: bypass for test (tied 0 everywhere)
    name: scan_mode
    width: 1
  - desc: reset used in scan mode
    name: scan_rst_n
    width: 1
  job: Turns an asynchronous active-low reset into one that asserts immediately and releases only after STAGES clean
    clock edges.
  outputs:
  - desc: async assert, sync release
    name: rst_n
    width: 1
  security_bounds:
    claimed: n/a (infrastructure).
    not_claimed: No metastability guarantee is provable by these tools.
scoreboard:
  _from: mom_scoreboard
  citations:
  - mom/rtl/mom_scoreboard.sv:137-150 - lowest free tag (loop from NTAG-1 down, last hit wins)
  - mom/rtl/mom_scoreboard.sv:171-181 - range guards, disp_ready, do_disp, do_comp
  - mom/rtl/mom_scoreboard.sv:187-191 - stale completion
  - mom/rtl/mom_scoreboard.sv:201-215 - combined increment/decrement, engine_full
  - mom/rtl/mom_scoreboard.sv:220-240 - allocate/retire
  - mom/rtl/mom_scoreboard.sv:245-255 - calibration feed
  - mom/rtl/mom_scoreboard.sv:260 - fence guard
  clock_reset: 'clk rising; async active-low reset: now = 0 (115-116), err_stale_comp 0 (189-191), queue_depth 0
    (206-207), all tags free with zeroed fields (221-228), cal_valid 0 (246-247). cal_engine/opclass/times have
    no reset term (updated every cycle).'
  evidence:
  - target: tile
    what: test_tag_exhaustion_and_recovery, test_stale_completion_is_flagged_not_absorbed, test_reg_fence_on_a_tag_that_does_not_exist,
      test_one_go_one_dispatch
  - target: tile (mutate_sim)
    what: '''completion tag range not checked'', ''a tag is always free'', ''fence indexes past the tags'''
  - target: system
    what: every dispatch completed once with the right tag; ci_selftest disables do_comp and requires make system
      to fail
  example: 'Tile (NTAG 4): three GOs of LARGE with no completion get tags 0, 1, 2 and BUSY = 0b0111 (test_one_go_one_dispatch).

    VERIFIED-SIM: SMALL dispatched at cycle 2541 (t_start = 2541), COMP at 3829 -> cal_t_measured = 3829 - 2541
    = 1288,

    cal_t_predicted = 27, cal_valid at 3830.

    '
  expert:
    assumptions:
    - On the tile the measured time is whatever the host waits before writing COMP plus SPI time, so calibration
      learns host latency, not engine latency.
    params:
    - meaning: tags
      name: NTAG
      value: 16 default; 4 tile; 8 hydra_mom_pins / hydra_sys_tile
    - meaning: per-engine outstanding limit
      name: QMAX
      value: 8 default; 4 on tile (= NTAG), hydra_mom_pins and hydra_sys_tile
    - meaning: engines
      name: NENG
      value: 5 or 6
    registers:
    - cite: mom/rtl/mom_scoreboard.sv:121-125
      name: per-tag entry
      value: busy 1 + engine 3 + opclass 4 + t_start 32 + t_pred 32 = 72 bits
    timing:
    - Allocation and timestamp on the do_disp edge (230-236); retirement on the do_comp edge (237-238); calibration
      sample registered one cycle after do_comp (249-253).
    - Free-running 32-bit cycle counter; measured time is modulo 2^32 (114-116, 252).
  failure: '- No free tag: disp_ready = 0 (177); the descriptor waits in mom_top''s cost register, then the features
    register and the pending GO fill, and READY falls.

    - Engine full (queue_depth >= QMAX): disp_ready = 0 for that engine; the cost engines also mark it !valid at
    costing time.

    - Completion for a tag >= NTAG or not busy: dropped, no state change, err_stale_comp next cycle (172, 181, 187-191).

    - Out-of-range disp_engine is never ready (171, 176).

    - Fence on a tag >= NTAG reads not busy (260).

    '
  inputs:
  - desc: c_valid && sel_ok && disp_accept
    name: disp_valid
    width: 1
  - desc: selected engine
    name: disp_engine
    width: 3
  - desc: op class
    name: disp_opclass
    width: 4
  - desc: t_pred_q[sel_eng]
    name: disp_t_pred
    width: 32
  - desc: completion pulse
    name: comp_valid
    width: 1
  - desc: completed tag
    name: comp_tag
    width: 4
  - desc: FENCE
    name: fence_tag
    width: 4
  job: Allocates the lowest free tag to each dispatch, remembers per tag the engine, op class, dispatch time and
    uncalibrated prediction, keeps per-engine outstanding counts, retires tags on completion and hands the measured-versus-predicted
    sample to the calibrator; also answers fence queries and flags stale completions.
  outputs:
  - desc: a tag is free and the engine is in range and not full
    name: disp_ready
    width: 1
  - desc: lowest free tag (combinational)
    name: disp_tag
    width: 4
  - desc: registered calibration sample
    name: cal_valid/cal_engine/cal_opclass/cal_t_measured/cal_t_predicted
    width: 1/3/4/32/32
  - desc: per-engine outstanding count
    name: queue_depth
    width: NENG x 8
  - desc: queue_depth >= QMAX
    name: engine_full
    width: NENG
  - desc: busy[fence_tag], 0 if out of range
    name: fence_busy
    width: 1
  - desc: registered pulse
    name: err_stale_comp
    width: 1
  - desc: busy bits
    name: tag_busy_vec
    width: NTAG
select:
  _from: mom_select
  citations:
  - mom/rtl/mom_select.sv:118-124 - lane packing
  - mom/rtl/mom_select.sv:132-135 - pick, <= keeps the lower index
  - mom/rtl/mom_select.sv:148-156 - tree plus chain for lanes >= 5
  - mom/rtl/mom_select.sv:166-187 - runner-up tree
  - mom/rtl/mom_select.sv:189-201 - outputs and margin rule
  - mom/rtl/mom_select.sv:207-227 - formal properties
  clock_reset: Purely combinational; no clock or reset.
  evidence:
  - target: select-proof
    what: 'sby prove at NENG 5 and 6: winner valid, minimal, ties to the lower index (mom/formal/mom_select.sby)'
  - target: mom-mutate
    what: 'SLOT-01: tree stops at five lanes -> systile-gpu must fail'
  example: 'Lanes {~valid, cost, index}: SMALL -> CPU {0,173,0}, SIMD {0,39,1}, TPU {0,71,2}, NTT {1,FFFFFFFF,3},
    CRYPTO {1,FFFFFFFF,4}.

    best = SIMD (39); second tree with SIMD forced invalid -> TPU (71); margin 32. VERIFIED-SIM.

    NENG = 6, INT32 GEMM 32x32x64, no energy: CPU 131072, SIMD 16392, GPU 8320 (TPU/NTT/CRYPTO incapable) -> engine
    5, margin 8072. VERIFIED-SIM.

    '
  expert:
    assumptions: []
    params:
    - meaning: lanes 5.. folded in after the 5-lane tree (148-156)
      name: NENG
      value: 5 or 6
    - meaning: build the second tree for the margin
      name: WANT_MARGIN
      value: 1
    registers: []
    timing:
    - Combinational, read from the cost register in the same cycle disp_valid is formed (mom_top.sv:381-386, 425).
  failure: 'All invalid: any_valid = 0 and sel_margin = 0; sel_engine is then meaningless and mom_top must not dispatch.
    An invalid lane can never win because the inverted valid bit is the comparison MSB (118-124).'
  inputs:
  - desc: registered costs (cost_q)
    name: cost
    width: NENG x 32
  - desc: 'ccapable_q & ~engine_full & eng_elig: since v3.10 the full flags are the scoreboard''s live ones'
    name: valid
    width: NENG
  - desc: ccapable_q & eng_elig
    name: capable
    width: NENG
  job: Combinationally picks the valid engine with the lowest cost (ties to the lower index), reports whether any
    engine is valid or capable, and the margin between the winner and the best valid runner-up.
  outputs:
  - desc: winner
    name: sel_engine
    width: 3
  - desc: winner cost (unused by mom_top)
    name: sel_cost
    width: 32
  - desc: '|valid'
    name: any_valid
    width: 1
  - desc: '|capable'
    name: any_capable
    width: 1
  - desc: runner-up minus winner; 0 if no valid runner-up
    name: sel_margin
    width: 32
sha256:
  _from: hydra_sha256_stream
  citations:
  - sec/rtl/hydra_sha256_stream.sv:23-40 - protocol and stall
  - sec/rtl/hydra_sha256_stream.sv:112 - bad = in_bytes>4 or partial word without in_last
  - sec/rtl/hydra_sha256_stream.sv:115-119 - tail_word with marker
  - sec/rtl/hydra_sha256_stream.sv:168-186 - accept, error, tail
  - sec/rtl/hydra_sha256_stream.sv:188-204 - padding loop
  - sec/rtl/hydra_sha256_stream.sv:300-328 - proved properties
  - sec/formal/sha256_stream.sby:9-19 - tasks and depths
  clock_reset: One domain; async active-low reset of controller state (lines 152-156). Contains hydra_sha256 (lines
    77-80) outside FORMAL.
  evidence:
  - target: make sha256-stream
    what: tb_sha256_stream at 140 lengths (0..130, 183, 184, 191, 192, 247, 248, 255, 256, 1000 bytes) vs hashlib
      + sby prove/blocks/cover (Makefile:179-187; sec/tb/sha256_stream_model.py:19)
  example: '"abc": start; one handshake with in_data=0x61626300, in_bytes=3, in_last=1. tail_word keeps 3 bytes
    and inserts the marker -> word 0 = 0x61626380 (lines 115-119, 138-139); the padding loop writes words 1..13
    = 0, word 14 = msg_bits[63:32] = 0, word 15 = msg_bits[31:0] = 0x18 (lines 143-149, 188-204); the block compresses
    and done pulses with digest ba7816bf...f20015ad (same as sha256_core).'
  expert:
    assumptions:
    - 'sha256_stream.sby prove: UNBOUNDED k-induction (depth 24) of properties 1,3,4,5: complete 16-word blocks
      each word once; length field equals bytes counted independently from handshakes; marker and zero padding placement;
      nothing after in_last (lines 224-236, 298-328; sha256_stream.sby:5-7,14-15)'
    - 'sha256_stream.sby blocks: BOUNDED bmc depth 48 for block count = floor((bytes+8)/64)+1, only for messages
      under 3900 bytes (lines 316-320; sby 16-17,26)'
    - 'Core is ABSTRACT in all proofs: same handshake, any latency, digest tied to 0 (lines 81-95). Digest arithmetic
      is only simulated'
    - Reset asserted in first cycle (line 240)
    params:
    - meaning: proof-only switch enabling the bounded block-count check (line 46)
      name: F_BLOCKS
      value: 0
    registers: []
    timing: 'Per block: 16 accept or pad cycles + S_GO (1) + S_WAIT until core done (65) (lines 98, 206-214). Length
      counter 61 bits of bytes (line 102).'
  failure: 'Protocol error (in_bytes > 4, or in_bytes != 4 without in_last): message abandoned, err=1 sticky, no
    digest (lines 112, 168-171). Backpressure: in_ready=0 while the core compresses (about 65 cycles per block)
    and in all non-ACCEPT states (line 121, 38-40). Nothing accepted after in_last until the next start (line 328).
    start during S_GO/S_WAIT/S_PAD is ignored (line 160).'
  inputs:
  - desc: clock
    name: clk
    width: 1
  - desc: active-low async reset
    name: rst_n
    width: 1
  - desc: begin a new message (accepted in S_IDLE or S_ACCEPT)
    name: start
    width: 1
  - desc: word offered
    name: in_valid
    width: 1
  - desc: first message byte in [31:24]
    name: in_data
    width: 32
  - desc: 4 on every word but the last; 0..4 on the last
    name: in_bytes
    width: 3
  - desc: this word ends the message
    name: in_last
    width: 1
  - desc: 'FORMAL only: abstract core latency chosen by solver'
    name: f_core_fin
    width: 1
  job: Accepts message bytes as big-endian 32-bit words over a valid/ready handshake, counts them, and appends the
    0x80 marker, zeros and the 64-bit bit-length itself, so the digest is SHA-256 of exactly the bytes accepted.
  outputs:
  - desc: S_ACCEPT and core not busy
    name: in_ready
    width: 1
  - desc: padding or hashing
    name: busy
    width: 1
  - desc: one-cycle pulse, digest final
    name: done
    width: 1
  - desc: 0 until a message completes, then holds until start
    name: digest
    width: 256
  - desc: sticky protocol error until start
    name: err
    width: 1
  - desc: bits accepted so far (the length field)
    name: msg_bits
    width: 64
  security_bounds:
    claimed: 'Hardware framing: software cannot choose the length field or padding (proved for the controller, any
      core latency).'
    not_claimed: No proof of digest values (simulation vs hashlib only). Not integrated into any build; used only
      inside hydra_measure.
simd:
  _from: simd_top
  citations:
  - engines/simd/rtl/simd_top.sv:57-69 - decode, groups = M >> 2 if aligned
  - engines/simd/rtl/simd_top.sv:109-111 - reduce fed only for REDUCE
  - engines/simd/rtl/simd_top.sv:126-130 - reduction bypasses the serialiser
  clock_reset: posedge clk, async active-low rst_n; tag_q, op_q (ADD), reduce_q latched on acceptance (simd_top.sv:77-85).
  evidence:
  - target: simd
    what: simd_model.py, every operation, both classes, random stalls, refusals
  - target: systile-two
    what: real vector unit with pattern operands behind the dispatcher (Makefile:471-478)
  example: "Verified by simulation and Python. ELEMENT ADD, M = 8:\n  group 0: a = [5, -3, 0x7fffffff, 100], b =\
    \ [7, 10, 1, -100] -> [12, 7, -2147483648 (wrap), 0]\n  group 1: a = [0x10000, -6, 9, 0],     b = [0x10000,\
    \ 7, -9, 1] -> [131072, 1, 0, 1]\nELEMENT MUL same data -> [35, -30, 2147483647, -10000, 0 (2^32 low half),\
    \ -42, -81, 0].\nREDUCE ADD -> -2147352555 (0x80020015).\n"
  expert:
    assumptions:
    - descriptor bits [2:0] are free (simd_pkg.sv:13-21); hydra_dma_gemm uses [32:3] for bank addresses
    memory_map: n/a
    params:
    - meaning: lanes
      name: N
      value: 4
    - meaning: descriptor
      name: WD_W
      value: 128
    - meaning: tag
      name: TAGW
      value: 4
    timing: ELEMENT +(6G+2), REDUCE +(G+5), G = M/4, no stalls.
  failure: M not a multiple of 4 or 0 -> groups = 0 -> BAD_DIMS (simd_top.sv:67-68, simd_ctrl.sv:57). SCALAR is
    accepted but performs the same lane-wise operation as ELEMENT (no broadcast; opclass_ok simd_top.sv:95-96, reduce
    only for class 2 simd_top.sv:97). Reduction result is presented for one cycle together with done (simd_top.sv:126-130).
  inputs:
  - desc: dispatch
    name: eng_valid
    width: 1
  - desc: '[127:124] op_class 0 SCALAR / 1 ELEMENT / 2 REDUCE, [123:121] dtype must be 2 (INT32), [116:101] element
      count M, [2:0] lane opcode'
    name: eng_wd
    width: 128
  - desc: tag
    name: eng_tag
    width: 4
  - desc: group available
    name: op_valid
    width: 1
  - desc: 4 x 32-bit, lane 0 low
    name: op_a
    width: 128
  - desc: 4 x 32-bit
    name: op_b
    width: 128
  job: Single Instruction Multiple Data (SIMD) vector unit as a dispatcher engine. Element-wise (and SCALAR, handled
    identically) jobs stream one 32-bit result per input element; REDUCE jobs return one 32-bit sum. The element
    count is dim_m and must be a non-zero multiple of 4.
  outputs:
  - desc: engine handshake
    name: eng_ready, eng_done
    width: 1
  - desc: tag
    name: eng_done_tag
    width: 4
  - desc: group consumed
    name: op_ready
    width: 1
  - desc: result flags
    name: res_valid, res_last
    width: 1
  - desc: result
    name: res_data
    width: 32
  - desc: 0 OK, 1 op class, 2 dtype, 3 dims
    name: status
    width: 2
spi:
  _from: hydra_tt_spi
  citations:
  - 'mom/rtl/hydra_tt_spi.sv:22-35 - protocol comment: mode 0, MSB first, tx_load timing'
  - mom/rtl/hydra_tt_spi.sv:62-74 - synchronisers, csn_s resets to 111
  - mom/rtl/hydra_tt_spi.sv:76-81 - rise/fall decode, cs_active
  - mom/rtl/hydra_tt_spi.sv:91 - cipo_o = tx_sr[7]
  - mom/rtl/hydra_tt_spi.sv:109-116 - cs_start/cs_end registered; CSn fall clears counters and loads
  - mom/rtl/hydra_tt_spi.sv:118-127 - receive on rising SCK, rx_valid at bit 8, byte index saturates at 31
  - mom/rtl/hydra_tt_spi.sv:128-135 - shift CIPO on falling SCK or load at boundary
  - mom/rtl/hydra_tt_spi.sv:139 - tx_sr <= tx_byte the cycle after tx_load
  - tt/formal/hydra_tt_spi.sby:1-22 - prove depth 24, cover depth 60
  clock_reset: 'Single clock clk, rising edge. Asynchronous active-low reset on every flop (always_ff @(posedge
    clk or negedge rst_n), hydra_tt_spi.sv:64,93). Reset values: sck_s=000, csn_s=111 (idle high so no phantom frame),
    copi_s=00 (lines 65-68); bitcnt, rx_sr, rx_byte, rx_index, byte_cnt, boundary, tx_sr, tx_load, cs_start, cs_end,
    rx_valid all 0 (lines 94-105).'
  evidence:
  - target: padmux
    what: 'runs tt/formal/hydra_tt_spi.sby prove (depth 24) on this file: rx_valid only after 8 rising edges, byte
      equals the pin bits, single-cycle pulse, frame restarts at bit 0/byte 0, tx_sr equals the byte presented on
      load (Makefile:221; hydra_tt_spi.sv:143-193)'
  - target: tile
    what: every SPI exchange of the 21 cocotb tests; mutate_sim 'SPI shifts LSB first' must fail test_reg_id_and_defaults
  - target: sky130
    what: chip through its pads answers SPI; ci_selftest drops every byte (bitcnt mutation) and requires make sky130
      to fail
  - target: systile
    what: same SPI target in the system tile
  example: "VERIFIED-SIM on the tile netlist (SCK = clk/10, HALF = 5 clk):\n  ID read  TX 80 00 00 00 00  ->  RX\
    \ 80 48 59 4D 33\n  RX byte 0 (0x80) is STATUS[15:8] presented on the cs_start tx_load; bytes 1..4 are ID =\
    \ 0x48594D33 MSB first.\nEdge timing (DERIVED): CSn falls -> cs_fall is seen after 2 clk edges, cs_start and\
    \ tx_load are registered on the 3rd,\ntx_sr is loaded on the 4th, so CIPO carries the first MSB about 4 clk\
    \ after CSn falls. A falling SCK shifts CIPO about\n3 clk after the pin edge (4 clk at a byte boundary, where\
    \ the next byte is loaded instead of shifted).\n"
  expert:
    assumptions:
    - SCK idles low (mode 0); a host that leaves CSn low through reset gets one empty frame, not an error (tt_um_hydra_mom.sv:67-68;
      test test_no_x_on_any_pin_after_reset).
    params: []
    registers: []
    timing:
    - 'All three pins pass the same synchroniser depth: edges are decoded from bits [2:1] of 3-bit SCK/CSn shift
      registers and COPI from bit 1 of a 2-bit one, so COPI is sampled from the same instant as the SCK rise (lines
      62-80).'
    - 'Mode 0: COPI sampled on synchronised rising SCK (118-127), CIPO shifted on synchronised falling SCK (128-135),
      MSB first both ways (119, 133, 91).'
    - 'First byte of a byte boundary: the falling edge after the 8th rising edge raises tx_load instead of shifting
      (129-131); tx_sr takes tx_byte the cycle after tx_load (139).'
    - SCK must stay below clk/8 (header 14-15; tile pin map tt_um_hydra_mom.sv:63). At the tile's 66 ns clock that
      is about 1.89 MHz (DERIVED).
  failure: 'A partial byte (fewer than 8 rising SCK edges before CSn rises) is discarded: bitcnt and byte_cnt are
    only cleared on the next CSn fall (lines 112-116) and rx_valid only fires on the 8th bit (121-127), so the register
    block simply sees fewer bytes. SCK edges with CSn high are ignored (shifting is gated by cs_active, line 117).
    No speed check: above clk/8 edges may be missed (header lines 14-15); that is a host rule, not detected. Byte
    count saturates at 31 (line 125).'
  inputs:
  - desc: system clock
    name: clk
    width: 1
  - desc: active-low asynchronous reset (on the tile, the synchronised reset from hydra_rst_sync)
    name: rst_n
    width: 1
  - desc: SPI clock pin
    name: sck_i
    width: 1
  - desc: controller-out target-in data pin
    name: copi_i
    width: 1
  - desc: chip select, active low
    name: csn_i
    width: 1
  - desc: byte to send next, sampled on the tx_load cycle
    name: tx_byte
    width: 8
  job: Serial Peripheral Interface (SPI) target that samples SCK, COPI and CSn in the system clock domain (no second
    clock), turning the pins into a stream of received bytes with a per-frame byte index, and shifting a byte supplied
    by the register block out on CIPO.
  outputs:
  - desc: controller-in target-out data = tx_sr[7]
    name: cipo_o
    width: 1
  - desc: one-cycle pulse, CSn fell (registered from the synchronised edge)
    name: cs_start
    width: 1
  - desc: one-cycle pulse, CSn rose; the register block commits here
    name: cs_end
    width: 1
  - desc: ~csn_s[1] (unused by the tile)
    name: cs_active
    width: 1
  - desc: one-cycle pulse after the 8th sampled bit of a byte
    name: rx_valid
    width: 1
  - desc: the byte, MSB first
    name: rx_byte
    width: 8
  - desc: byte number within the frame, 0 = command, saturates at 31
    name: rx_index
    width: 5
  - desc: 'pulse: present tx_byte now (start of frame and each byte boundary)'
    name: tx_load
    width: 1
