mailbox:
  _from: hydra_mailbox
  citations:
  - sec/rtl/hydra_mailbox.sv:13-22 - protocol summary
  - sec/rtl/hydra_mailbox.sv:99-100 - is_owner and stranger
  - sec/rtl/hydra_mailbox.sv:122-133 - atomic grant on LOCK read
  - sec/rtl/hydra_mailbox.sv:140 - DATAIN pointer saturates
  - sec/rtl/hydra_mailbox.sv:151-157 - EXECUTE=0 releases lock, only release path
  - 'sec/rtl/hydra_mailbox.sv:164-167 - unlocked access: error only on write'
  - sec/rtl/hydra_mailbox.sv:189-202 - formal properties
  - sec/tb/tb_mailbox.sv:1-8 - bench purpose
  clock_reset: One domain. rst_n active low, async assert (line 102); resets lock, owner, cmd/dlen, status=CMD_BUSY,
    execute, pointers, rdata, error and cmd_valid (lines 103-108). The payload array is NOT reset (line 94, never
    in reset branch).
  evidence:
  - target: make mailbox
    what: tb_mailbox.sv (two contending requesters) + sby prove and cover (Makefile:199-205)
  example: Requester 3 reads LOCK (req_reg=0) -> req_rdata=0 next cycle, locked=1, owner=3 (lines 122-133). Requester
    5 reads LOCK -> req_rdata=1, no error, no grant (lines 100, 126). Requester 5 writes COMMAND -> req_error=1,
    cmd_q unchanged (lines 115-121). Requester 3 writes COMMAND=0x10, DLEN=8, two DATAIN words, then EXECUTE=1 ->
    cmd_valid=1 (lines 136-150). Service side pulses cmd_done with cmd_status_in=2'b10 -> status_q=CMD_COMPLETE,
    cmd_valid=0 (lines 112, 170). Requester 3 reads STATUS -> 2. Requester 3 writes EXECUTE=0 -> locked=0, owner=0
    (lines 151-157).
  expert:
    assumptions:
    - 'mailbox.sby prove: k-induction depth 14; cover depth 20 (mailbox.sby:11-14)'
    - 'Proved: owner stable while locked (mutual exclusion) (line 189); lock released only by owner writing EXECUTE=0
      (lines 192-195); a stranger never becomes owner (line 198); a stranger''s write leaves cmd/dlen unchanged
      (lines 201-202)'
    - 'Environment: reset asserted in the first cycle (line 182); req_user is taken as truthful -- identity is NOT
      authenticated by this block'
    - 'Not proved: payload confidentiality or integrity between owners, DATAIN overflow behaviour, status sequencing'
    params:
    - meaning: data width (line 45)
      name: DW
      value: 32
    - meaning: payload words (line 46)
      name: DEPTH
      value: 16
    - meaning: requester id width (line 47)
      name: UW
      value: 4
    registers:
    - 0 LOCK (read = test-and-take, returns previous lock state) (lines 75, 122-133)
    - 1 COMMAND rw (lines 76, 136)
    - 2 DLEN rw (lines 77, 137)
    - 3 DATAIN write-only, auto-increment (lines 78, 138-141)
    - 4 DATAOUT read-only, auto-increment (lines 79, 142-145)
    - 5 EXECUTE rw; writing 0 releases the lock (lines 80, 147-161)
    - '6 STATUS read: 00 CMD_BUSY, 01 DATA_READY, 10 CMD_COMPLETE, 11 CMD_FAILURE (lines 81, 83-86, 146)'
    timing: Every access completes in one cycle; read data and error are registered (valid one cycle later) (lines
      109-110, 126).
  failure: 'Stranger (not owner, not a LOCK read, while locked): refused, req_error=1, rdata 0 (lines 100, 115-121).
    Write while unlocked (any register): req_error=1, no effect (lines 164-167); read while unlocked of a non-LOCK
    register: returns 0 with NO error (line 166). DATAIN overflow: write pointer saturates at DEPTH-1, so extra
    words overwrite the last slot silently (line 140); DATAOUT read pointer saturates likewise (line 144). DLEN
    is not checked against DEPTH. No timeout or forced release: a dead owner holds the lock until reset (lines 152-154).
    The owner can release while a command is still running (EXECUTE=0 clears cmd_valid, line 150) and cmd_done after
    that is ignored for status (line 112). Payload, COMMAND and DLEN are NOT cleared on release or grant; only the
    pointers reset on grant (lines 130-131), so the next owner can read the previous owner''s payload via DATAOUT
    and the previous COMMAND/DLEN.'
  inputs:
  - desc: single clock
    name: clk
    width: 1
  - desc: active-low async reset
    name: rst_n
    width: 1
  - desc: access strobe
    name: req_valid
    width: 1
  - desc: requester identity (trusted input from the interconnect)
    name: req_user
    width: UW=4
  - desc: register index 0..6
    name: req_reg
    width: 3
  - desc: 1 write, 0 read
    name: req_write
    width: 1
  - desc: write data
    name: req_wdata
    width: DW=32
  - desc: service side finished
    name: cmd_done
    width: 1
  - desc: status to latch on cmd_done
    name: cmd_status_in
    width: 2
  - desc: service side reads payload at buf_addr
    name: buf_re
    width: 1
  job: 'A small command mailbox: a requester takes the lock by READING the LOCK register, writes command, length
    and payload, sets EXECUTE, polls STATUS, and clears EXECUTE to release. The owner''s identifier is latched on
    grant and other requesters'' accesses (other than LOCK reads) are refused and flagged.'
  outputs:
  - desc: registered read data (valid the cycle after the request)
    name: req_rdata
    width: 32
  - desc: registered one-cycle protocol-violation flag
    name: req_error
    width: 1
  - desc: EXECUTE=1 written, until cmd_done
    name: cmd_valid
    width: 1
  - desc: COMMAND register
    name: cmd_code
    width: 32
  - desc: DLEN register
    name: cmd_dlen
    width: 32
  - desc: = read pointer
    name: buf_addr
    width: clog2(DEPTH)=4
  - desc: payload[buf_addr] when buf_re, else payload[0]
    name: buf_rdata
    width: 32
  - desc: lock held
    name: locked
    width: 1
  - desc: latched owner id (0 when free)
    name: owner
    width: 4
  security_bounds:
    claimed: Mutual exclusion of the lock and refusal of non-owner writes, given an honest req_user (proved, mailbox.sby).
    not_claimed: Not a root of trust and contains no Caliptra code (lines 30-40). No requester authentication (req_user
      is an input), no clearing of payload/command between owners (residual data readable by the next owner), no
      overflow error, no timeout. NOT instantiated in any build.
