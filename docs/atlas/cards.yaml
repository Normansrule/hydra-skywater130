  - mom/rtl/mom_features.sv:126-157 - log2 W by op class
  - mom/rtl/mom_features.sv:169 - log2 I = log2 W - log2 Q, signed
  - mom/rtl/mom_features.sv:174-192 - output register
  clock_reset: clk rising; async active-low reset; out_valid, out_wd, logs reset to 0 (lines 174-180).
