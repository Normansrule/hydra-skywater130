# Block cards for the Silicon Atlas, keyed by the block ids in atlas.yaml.
# Written from the RTL with file:line citations (2026-10-18), not from prose docs.
# Statements marked VERIFIED-SIM were checked in a scratch simulation of the repository RTL;
# UNVERIFIED marks what could not be checked. `_contradictions` lists where documents and RTL
# disagree; the page shows them on the Evidence tab.
