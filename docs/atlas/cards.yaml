  - target: make jtag-harness
    what: UART and JTAG hosts into one tile, alone and together (Makefile:351-358)
  example: 'From any state: TMS=1 x5 -> TEST_LOGIC_RESET, IR=0x1 (IDCODE). TMS=0 -> RUN_TEST_IDLE. TMS=1,0,0 ->
    SELECT_DR, CAPTURE_DR (id_shift <= 0x1130001D), SHIFT_DR; 32 shifts put 0x1130001D on TDO LSB first (1,0,1,1,1,0,0,0,...).
    Select USER: from RTI TMS=1,1,0,0 -> SELECT_DR, SELECT_IR, CAPTURE_IR (ir_shift <= 0001), SHIFT_IR; shift 0x8
    LSB first (TDI 0,0,0,1, TMS=1 on the last -> EXIT1_IR), TDO shows the captured 1,0,0,0; TMS=1 -> UPDATE_IR (ir=0x8),
    TMS=0 -> RTI. Then a 40-bit DR scan of user_dr = {rw, addr[6:0], data[31:0]}, e.g. 0x81000000C3 = write, addr
    0x01, data 0xC3; UPDATE_DR raises user_update for one TCK (lines 155-159).'
  expert:
    assumptions:
    - jtag_tap.sby prove is BMC depth 10 (bounded), with multiclock on; the comment argues completeness because
      the initial state is unconstrained and the property needs a 5-step window (jtag_tap.sby lines 18-25 of that
      file)
    - 'Proved properties: tms_run>=5 implies TLR (lines 189-194); after TLR, ir == IDCODE (lines 201-202); tdo_oe
      low outside SHIFT states (lines 215-216); covers lines 206-207'
    params:
    - meaning: instruction register width (line 51)
      name: IRW
      value: 4
    - meaning: version 1, part 0x1300, manufacturer field 0x00E (placeholder, NOT a JEDEC id), bit0=1 (lines 43-46,
        52)
      name: IDCODE
      value: 32'h1130_001D
    - meaning: user DR = rw + 7-bit addr + 32-bit data (line 53)
      name: DRW
      value: 40
    registers:
    - IR 0x1 IDCODE, 0x8 USER, 0xF BYPASS; others behave as bypass (lines 116-118, 168-171)
    - IR capture pattern 0001 (low bits 01) (line 128)
    timing: State changes on rising TCK; TDO updated on falling TCK so the probe samples settled data on rising
      TCK (lines 164-176).
  failure: Unknown instructions select the 1-bit bypass register (line 171). There is no busy handling here; the
