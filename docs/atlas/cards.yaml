abi:
  _from: hydra_abi_v2
  citations:
  - sys/rtl/hydra_abi_v2.sv:128-142 - policy to mask
  - sys/rtl/hydra_abi_v2.sv:145-155 - first failing check wins
  clock_reset: posedge clk, async active-low rst_n clears context table and FSM (hydra_abi_v2.sv:113-116,162-165).
  evidence:
  - target: abi-v2
    what: 4000 random cases vs sys/tb/abi_v2_model.py plus proof (Makefile:286-292)
  - target: systile-abi
    what: end to end on six slots
  example: 'Header for AUTO, PUBLIC_DEBUG, context 1 epoch 7: [63:60]=2, [54:47]=1, [46:31]=7 -> 0x2000_8003_8000_0000
    (2<<60 | 1<<47 | 7<<31 = 0x2000800380000000, Python-checked). With context 1 owned at epoch 7 and all slots
    healthy: elig = 6''b111111 & PRESENT & healthy. Policy 3 (TPU) -> elig = 6''b000100. Epoch 8 in the table ->
    err_code 5. UNVERIFIED by my own simulation.'
  expert:
    assumptions: []
    memory_map: 'Header bits: [63:60] version, [59:58] mode, [57:55] policy, [54:47] context, [46:31] epoch, [30:23]
      key, [22:15] profile, [14:0] reserved (:101-108).'
    params:
    - meaning: slots
      name: NENG
      value: ENG_N_CHIP = 6
    - meaning: contexts
      name: NCTX
      value: 16
    - meaning: slots that exist
      name: PRESENT
      value: 8'b0011_1111
    timing: 'Registered verdict: out_valid or err_valid the cycle after in_valid; next job only after sched_done
      (:169-177).'
  failure: 'Codes: 1 version, 2 reserved, 3 mode (FHE/SE refused), 4 policy > 5, 5 context/epoch, 6 key or profile
    non-zero, 7 empty mask (:97-98,145-155). PRESENT defaults to 6''b111111 including slots 3 (NTT) and 4 (CRYPTO),
    which in hydra_sys_tile are only latency models, so a forced-NTT job goes to a latency model (:66, hydra_sys_tile.sv:514-518).'
  inputs:
  - desc: job in
    name: in_valid, in_hdr, in_body
    width: 1/64/128
  - desc: scheduler took it / dispatched or refused it
    name: out_ready, sched_done
    width: 1
  - desc: context table write
    name: ctx_we, ctx_id, ctx_owned, ctx_epoch
    width: 1/8/1/16
  - desc: healthy-engine mask
    name: healthy
    width: NENG
  job: Checks a 64-bit header placed in front of each 128-bit descriptor (version, reserved bits, security mode,
    engine policy, context and epoch, key/profile) and turns it into an engine-eligibility mask that the scheduler
    applies before comparing costs; refuses with a code otherwise. Forwards one job at a time.
  outputs:
  - desc: IDLE
    name: in_ready
    width: 1
  - desc: to scheduler
    name: out_valid, out_body, out_elig
    width: 1/128/NENG
  - desc: refusal (tag = body[42:35])
    name: err_valid, err_code, err_tag
    width: 1/4/8
