    what: no mutation suite for sec/ in Makefile mutate (Makefile:559-564)
  example: 'Synthetic key (NOT a real key): words 0..7 = 0x00000000..0x00000007. Host pulses host_we with host_slot=2,
    host_word=i, host_wdata=i for i=0..7; on the 8th write filled[2] rises (line 119-120). Host pulses host_lock
    with host_slot=2 -> locked[2]=1 (line 124). With host_rd_slot=2, host_rdata = 0x00080403 (filled=1, locked=1,
    NSLOT=4, NWORD=8; lines 133-137). Engine drives eng_req=1, eng_slot=2 -> eng_key = 256''h00000007_00000006_..._00000000
    (word 0 lowest, line 117) and eng_valid=1 (line 142). A later host_we to slot 2 is dropped and err_locked=1
    the next cycle (lines 91, 103). host_wipe zeroes every slot and clears every seal (lines 105-114).'
  expert:
    assumptions:
    - 'key_vault.sby task prove (k-induction, depth 12) proves the in-RTL asserts: sealed slot keeps contents, seal
      is one-way until wipe, wipe leaves nothing, unfilled slot never valid (hydra_key_vault.sv:155-176; key_vault.sby:16-17)'
    - 'key_vault.sby task ni: UNBOUNDED k-induction (depth 4) of non-interference at NSLOT=2, KW=64 (key_vault_ni.sv:40-42;
      key_vault.sby:18-19)'
    - 'key_vault.sby task ni_full: same proof at NSLOT=4, KW=256, WW=32 via chparam (key_vault.sby:20-21,34)'
    - 'NI environment: reset asserted at the first clock edge (clocked assume, key_vault_ni.sv:95-97); both copies
      share every control input; only host_wdata differs (key_vault_ni.sv:46-57)'
    - NI compares ONLY host_rdata, err_locked and eng_valid, plus the bookkeeping invariants (key_vault_ni.sv:101-109).
      eng_key is not compared, by design
    - 'cover task: key_a != key_b reachable, so ni is not vacuous (key_vault_ni.sv:114; key_vault.sby:22-23)'
    - Proofs run on sv2v output of the RTL with -DFORMAL (Makefile:207-213); FORMAL-only ports f_* are absent in
      synthesis (hydra_key_vault.sv:70-79)
    params:
    - meaning: key slots (line 44)
      name: NSLOT
      value: 4
    - meaning: bits per key (line 45)
      name: KW
      value: 256
    - meaning: bits per write (line 46)
      name: WW
      value: 32
    registers:
    - host_rdata bit0 filled, bit1 locked, [15:8] NSLOT, [23:16] NWORD (lines 132-138)
    timing: Writes take effect at the next clk edge; eng_key/eng_valid/host_rdata are combinational (lines 132-142).
  failure: 'Write to a sealed slot: dropped, err_locked pulses one cycle later (lines 90-91, 103). Write in the
    same cycle as host_wipe: dropped silently, no error (line 91). Sealing is allowed on an empty or partly written
    slot; such a slot stays unusable (eng_valid=0) until a wipe (lines 124, 142). eng_valid=0 for an unfilled slot,
    but eng_key still carries that slot''s partial bits whenever eng_req=1 (line 141). No busy/backpressure: all
    combinational reads, single-cycle writes. There is no error for out-of-range indices because the default geometry
    makes every index legal.'
  inputs:
  - desc: single clock domain
    name: clk
    width: 1
  - desc: active-low asynchronous reset
    name: rst_n
    width: 1
  - desc: write one 32-bit key word
    name: host_we
    width: 1
  - desc: slot for write/lock
    name: host_slot
    width: clog2(NSLOT)=2
  - desc: word index; word 0 is key bits [31:0]
    name: host_word
    width: clog2(KW/WW)=3
  - desc: key word
    name: host_wdata
    width: 32
  - desc: seal host_slot (one-way until wipe)
    name: host_lock
    width: 1
  - desc: clear every slot, seal and fill flag
    name: host_wipe
    width: 1
  - desc: which slot's status to show
    name: host_rd_slot
    width: 2
  - desc: engine requests a key
    name: eng_req
    width: 1
  - desc: slot the engine wants
    name: eng_slot
    width: 2
  job: Holds NSLOT keys of KW bits that the host writes 32 bits at a time and that an engine uses by slot number.
    The host-side read port returns only metadata (filled, sealed, geometry); there is no path from key storage
    to it.
  outputs:
  - desc: '{8''b0, NWORD[23:16], NSLOT[15:8], 6''b0, locked, filled} of host_rd_slot'
    name: host_rdata
    width: 32
  - desc: 'registered: previous cycle wrote to a sealed slot'
    name: err_locked
    width: 1
  - desc: key[eng_slot] while eng_req, else 0 (even for an unfilled slot)
    name: eng_key
    width: KW=256
  - desc: eng_req && slot filled
    name: eng_valid
    width: 1
  - desc: FORMAL-only bookkeeping ports, absent in synthesis
    name: f_locked/f_filled/f_seen
    width: NSLOT / NSLOT / NSLOT*NWORD
  security_bounds:
    claimed: 'Proved (unbounded, at the shipped 4x256 size): for any key material and any command sequence after
      a reset, the host-visible outputs host_rdata, err_locked and eng_valid are independent of key bits; sealed
      slots are immutable until wipe; wipe clears everything.'
    not_claimed: 'Nothing about eng_key consumers: any engine that copies eng_key to host-readable state breaks
      the property, and the vault does not control who drives eng_req/eng_slot (lines 141-142). The host WRITES
      the keys, so the host knew them (docs/security/threat-model.md:57). Volatile: cleared by reset, no non-volatile
      storage (lines 37-39). No protection against power/timing side channels, scan-chain access, fault injection
      or physical attack (lines 30-35). No privilege check inside the vault (privilege is enforced only in hydra_xsec_unit).
      Wipe has no ISA instruction. NOT instantiated in any build (no plan, chip top or tile instantiates it).'
xbar:
  _from: mom_xbar
  citations:
  - common/rtl/mom_xbar.sv:113-132 - range check, forward, accept
  - common/rtl/mom_xbar.sv:139-144 - tag override in the start cycle
  - common/rtl/mom_xbar.sv:147-183 - completion check, round-robin, comp outputs
  - common/rtl/mom_xbar.sv:185-212 - state update
  - common/rtl/mom_xbar.sv:214-279 - formal properties
  clock_reset: 'clk rising; async active-low reset: busy_q, pend_q, rr_ptr, tag_q, error flags = 0 (186-192). Accept
    and start are also gated combinationally by rst_n (124-125).'
  evidence:
  - target: xbar
    what: 20k random vectors vs xbar_model.py and sby prove of X0..X8 incl. 'no completion is lost'
  - target: xbar-bound
    what: NENG 1, 5, 7, 8 range bound (RTL-08)
  - target: mom-mutate
    what: RTL-08 bound narrowed -> xbar-bound must fail
  - target: system
    what: real mom_top driving it
  example: 'DERIVED: engine 2 idle and ready, disp_valid with engine 2 tag 5 -> eng_valid = 00100, eng_tag[2] =
    5 that cycle,

    disp_accept = 1; busy_q[2] = 1, tag_q[2] = 5 next edge. Later eng_done[2] with tag 5 -> done_ok[2]; if picked
    by

    round-robin the same cycle, comp_valid = 1, comp_tag = 5, busy and pend cleared, rr_ptr = 3.

    '
  expert:
    assumptions:
    - 'Environment assumption for the proofs: honest engines report done once, with the held tag (219-227).'
    params:
    - meaning: engines
      name: NENG
      value: 5 default
    - meaning: '-'
      name: NTAG
      value: 8 default (declared, unused in the body)
    - meaning: widths
      name: WD_W/TAGW/ENGW
      value: 128/4/3
    registers: []
    timing:
    - Dispatch accept is combinational in the forwarding cycle (132); a completion can be reported in the same cycle
      eng_done rises (155, 182).
    - At most one engine started and one completion reported per cycle (X2, round-robin 163-180).
  failure: 'Busy or not-ready target: disp_accept = 0, MOM holds (118, 124, 132). Engine index >= NENG: accepted
    and dropped, err_bad_engine (113, 125, 194). Completion not matching (wrong tag, engine not busy, already pending):
    not forwarded, err_done_unknown (150-152, 195). A completed engine stays busy until reported, so a result cannot
    be overwritten (X5).'
  inputs:
  - desc: from mom_top
    name: disp_valid/disp_engine/disp_tag/disp_wd
    width: 1/ENGW/TAGW/WD_W
  - desc: engine can take work
    name: eng_ready
    width: NENG
  - desc: engine completion
    name: eng_done
    width: NENG
  - desc: completion tags
    name: eng_done_tag
    width: NENG x TAGW
  job: Forwards a dispatch to the chosen engine only when that engine is idle and ready, keeps the engine busy until
    its completion has been reported, checks each completion's tag against the tag it handed out, and returns one
    completion per cycle to the scheduler in round-robin order. Used by hydra_sys_tile (FPGA images, system simulations),
    not by the tile or by hydra_mom_pins.
  outputs:
  - desc: fwd || bad (combinational)
    name: disp_accept
    width: 1
  - desc: to mom_top (combinational from pend_q | done_ok)
    name: comp_valid/comp_tag
    width: 1/TAGW
  - desc: one-hot start
    name: eng_valid
    width: NENG
  - desc: shared descriptor; tag overridden with disp_tag in the start cycle
    name: eng_wd/eng_tag
    width: WD_W / NENG x TAGW
  - desc: busy_q
    name: eng_busy
    width: NENG
  - desc: 'registered: out-of-range engine accepted and dropped'
    name: err_bad_engine
    width: 1
  - desc: 'registered: completion with wrong tag, idle engine, or already pending'
    name: err_done_unknown
    width: 1
xsec:
  _from: hydra_xsec_unit
  citations:
  - isa/rtl/hydra_xsec_unit.sv:15-38 - encodings
  - isa/rtl/hydra_xsec_unit.sv:43-52 - three rules
  - isa/rtl/hydra_xsec_unit.sv:122-124 - is_hsec, machine, needs_m
  - isa/rtl/hydra_xsec_unit.sv:133-136 - kv_slot rs1[4:3], kv_word rs1[2:0], kv_rd_slot rs1[1:0]
  - isa/rtl/hydra_xsec_unit.sv:146-164 - execute
  - isa/rtl/hydra_xsec_unit.sv:169-185 - formal asserts
  - isa/formal/xsec_ni.sv:63-75 - two vaults, wipe and engine tied off
  - isa/formal/xsec_ni.sv:82-90 - NI asserts and hierarchical cover
  - isa/tb/xsec_vectors.txt:3 - sum0 vector
  clock_reset: 'No clock, no reset, no state: purely combinational (lines 126-167).'
  evidence:
  - target: make xsec
    what: tb_xsec_unit on isa/tb/xsec_vectors.txt (231 lines) vs xsec_model.py, then sby priv, ni, ni_full (Makefile:77-86)
  example: sha256sum0 x5, x6 encodes as insn 0x10031293 (funct7 0001000, rs2 field 00000, funct3 001, opcode 0010011;
    lines 15-18). With rs1=0x0000000080000000 at priv=3 the unit returns rd_we=1, rd=0x0000000020040200 (isa/tb/xsec_vectors.txt:3;
    ror2^ror13^ror22 of 0x80000000, line 114; sign-extended, line 144). hsec.kvwrite at priv=00 (user) -> illegal=1,
    kv_we=0 (lines 146-148).
  expert:
    assumptions:
    - 'xsec.sby priv: mode prove depth 2 on combinational asserts: no kv_we/kv_lock outside machine mode; such attempts
      set illegal; illegal implies no side effect; at most one side effect (lines 169-185; xsec.sby:12-13)'
    - 'xsec.sby ni / ni_full: two units each with its own vault, identical instruction stream and operands, different
      key words; asserts rd, rd_we and illegal equal (xsec_ni.sv:82-89). UNBOUNDED k-induction depth 4 at NSLOT2/KWORDS2
      and NSLOT4/KWORDS8 (xsec.sby:14-17, 28)'
    - 'NI environment ties host_wipe=0, eng_req=0 and pcr_value=0 (xsec_ni.sv:54, 61, 65, 67): the proof does not
      cover wipe, the engine path or PCR reads'
    - xsec_ni's non-vacuity cover uses a hierarchical reference v_a.key[0] (xsec_ni.sv:90) and xsec.sby has no cover
      task (xsec.sby:7-9); key_vault_ni.sv:24-28 says hierarchical references did not survive sv2v conversion
    params:
    - meaning: vault slots (line 63)
      name: NSLOT
      value: 4
    - meaning: 32-bit words per key (line 64)
      name: KWORDS
      value: 8
    registers:
    - 'Zknh (OP-IMM 0010011, funct3 001, funct7 0001000): rs2 field 00000 sha256sum0, 00001 sum1, 00010 sig0, 00011
      sig1; low 32 bits of rs1, result sign-extended (lines 15-21, 108-119, 144)'
    - 'custom-0 0001011, funct7 0000000 (lines 26-38, 122):'
    - '  000 hsec.kvstat rd, rs1 - rd = {32''b0, kv_rdata}, any privilege (line 151)'
    - '  001 hsec.kvwrite rs1, rs2 - vault word write, MACHINE only (lines 124, 152)'
    - '  010 hsec.kvlock rs1 - seal slot, MACHINE only (lines 124, 153)'
    - '  011 hsec.pcrrd rd, rs1 - 64-bit word rs1[1:0] of PCR, word 0 most significant, any privilege (lines 154-159)'
    - '  100 hsec.measw rs1, rs2 - meas_we with word rs1[2:0], data rs2[31:0], any privilege (lines 138-139, 160)'
    - '  101 hsec.pcrext - pcr_extend pulse, any privilege (line 161)'
    - '  110 hsec.cteq rd, rs1, rs2 - rd = (rs1 == rs2), any privilege (line 162)'
    - '  111 reserved - illegal (line 163)'
    timing: Single-cycle combinational; data-independent latency by construction (lines 50-52) -- structural argument,
      not measured or proved.
  failure: 'kvwrite/kvlock outside machine mode -> illegal trap, no side effect (lines 124, 146-148). funct3=111
    -> illegal at any privilege (line 163). custom-0 with funct7 != 0, or any other opcode, is not claimed (claim=0)
    (lines 122, 127). Note the slot-field split: kvwrite/kvlock take slot from rs1[4:3] and word from rs1[2:0] (lines
    133-134), but kvstat takes slot from rs1[1:0] (line 136).'
  inputs:
  - desc: instruction valid
    name: valid
    width: 1
  - desc: instruction word
    name: insn
    width: 32
  - desc: source 1
    name: rs1
    width: 64
  - desc: source 2
    name: rs2
    width: 64
  - desc: 11 machine, 01 supervisor, 00 user
    name: priv
    width: 2
  - desc: vault status word
    name: kv_rdata
    width: 32
  - desc: measurement register
    name: pcr_value
    width: 256
  job: 'Combinational decode/execute unit for an RV64 (64-bit RISC-V) core: the four ratified Zknh SHA-256 sigma/sum
    instructions, and seven custom-0 instructions that talk to a key vault and a measurement register by slot number,
    plus a constant-time equality compare. It is not connected to any CPU in this repository.'
  outputs:
  - desc: this unit decodes the instruction
    name: claim
    width: 1
  - desc: raise an illegal-instruction trap
    name: illegal
    width: 1
  - desc: write rd
    name: rd_we
    width: 1
  - desc: result
    name: rd_val
    width: 64
  - desc: vault controls
    name: kv_we/kv_slot/kv_word/kv_wdata/kv_lock/kv_rd_slot
    width: 1/2/3/32/1/2
  - desc: measurement staging and extend (no consumer exists in the repo)
    name: meas_we/meas_word/meas_wdata/pcr_extend
    width: 1/3/32/1
  security_bounds:
    claimed: (a) no instruction moves vault key bits into rd (NI, unbounded, with wipe/engine/PCR tied off); (b)
      key write and seal need machine mode and trap elsewhere (proved).
    not_claimed: Not wired into any core; the trap must still be plumbed into a pipeline's exception logic (docs/ISA_SECURITY.md:108-112).
      measw and pcrext are allowed at ANY privilege, so user code can extend the PCR (lines 124, 160-161). No consumer
      of meas_we/meas_word/pcr_extend exists in the repository (hydra_pcr takes a 256-bit meas port, hydra_pcr.sv:46-47).
      Constant-time is structural only; no power side-channel claim (docs/ISA_SECURITY.md:100-103). No wipe instruction.
