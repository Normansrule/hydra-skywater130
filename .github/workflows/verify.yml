# Runs every check in the repository on each push.
#
# Two lessons from the red runs of 2026-10-06..08:
#  * The runner differs from a desktop in what is ALREADY installed. Current
#    SymbiYosys imports the Python module `click`, which a desktop happened to
#    have and the runner did not; bootstrap-ubuntu.sh now installs it and
#    checks that sby actually starts.
#  * Vendor pin files were fetched from upstream BRANCHES; an upstream edit
#    changed a hash and failed every run. tools/import_boards.py now pins
#    each file to a commit.
# The first green run: ci-diagnose branch, 2026-10-08, run 37718967165.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Toolchain
        run: ./scripts/bootstrap-ubuntu.sh --system

      - name: Fetch vendor pin files
        run: python3 tools/import_boards.py fetch

      - name: Verify
        # -k: run every check even after one fails, so a red run lists ALL
        # the failures, not just the first. The log goes to a file for the
        # next step.
        run: |
          set -o pipefail
          make -k verify 2>&1 | tee verify.log

      # The full log is kept whether the run passed or failed (SkyWater 130
      # audit BUILD-03): a red run must be diagnosable from its artifacts.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: verify-log
          path: verify.log
          if-no-files-found: error

      - name: Report what failed
        # Annotations show on the run's summary page and through the API,
        # without opening the log: one per failing make target, plus the
        # lines around each FAIL. (Added 2026-10-08, when two red runs could
        # only be diagnosed by reproducing the runner by hand.)
        if: failure()
        run: |
          grep -n "make: \*\*\*" verify.log | head -10 | while IFS= read -r l; do
            echo "::error title=make target failed::${l}"
          done
          grep -nE -B3 "FAIL|Traceback|Error:|error:|No such file|not found|DONE \((FAIL|ERROR|UNKNOWN)" verify.log \
            | grep -v "^--$" | tail -40 | awk '{printf "%s%%0A", $0}' > excerpt.txt || true
          [ -s excerpt.txt ] && echo "::error title=failing lines::$(cat excerpt.txt)"

      - name: Place and route the ULX3S build
        run: |
          python3 tools/hydra_bind.py build --plan plans/ulx3s-85f.yaml
          make -C fpga/build/ulx3s-85f 2>&1 | tee fpga/build/ulx3s-85f/pnr.log
          grep -E "Max frequency|utilisation" -A3 fpga/build/ulx3s-85f/pnr.log || true
          cat fpga/build/ulx3s-85f/*.manifest

      # Audit R6 (2026-10-11): a gate is only a gate if it can close. Ask the
      # same design for a clock it cannot reach; place and route MUST fail.
      - name: An impossible clock must fail the build
        run: |
          cd fpga/build/ulx3s-85f
          sed 's/--freq 12.5/--freq 400/' Makefile > Makefile.impossible
          rm -f hydra_ulx3s_tt.config
          if make -f Makefile.impossible hydra_ulx3s_tt.config > impossible.log 2>&1; then
            echo "::error title=timing gate::a 400 MHz target placed and routed -- the timing gate does not work"
            exit 1
          fi
          grep -E "Max frequency|FAIL|ERROR" impossible.log | tail -3
          rm -f hydra_ulx3s_tt.config Makefile.impossible

      # A missing bitstream is a failed build, not an upload warning.
      - uses: actions/upload-artifact@v5
        with:
          name: ulx3s-bitstream
          path: |
            fpga/build/ulx3s-85f/*.bit
            fpga/build/ulx3s-85f/*.manifest
            fpga/build/ulx3s-85f/pnr.log
          if-no-files-found: error

      # Every kind of failure must be able to turn this workflow red: break
      # the design on purpose, one stage at a time (scripts/ci_selftest.sh).
      - name: Broken designs make the build fail
        run: ./scripts/ci_selftest.sh

  mutate:
    # Slow (every test is broken on purpose and must fail), so it runs on
    # demand and on the default branch rather than on every pull request.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: ./scripts/bootstrap-ubuntu.sh --system
      - run: make mutate
