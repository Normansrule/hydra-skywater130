# Runs every check in the repository on each push.
#
# The runner differs from a desktop in what is ALREADY installed. Runs #3 and
# #4 (2026-10-06/07) failed because current SymbiYosys imports the Python
# module `click`, which a desktop happened to have and the runner did not;
# bootstrap-ubuntu.sh now installs it and checks that sby actually starts.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Toolchain
        run: ./scripts/bootstrap-ubuntu.sh --system

      - name: Fetch vendor pin files
        run: python3 tools/import_boards.py fetch

      - name: Verify
        run: make verify

      - name: Place and route the ULX3S build
        run: |
          python3 tools/hydra_bind.py build --plan plans/ulx3s-85f.yaml
          make -C fpga/build/ulx3s-85f
          grep -E "Max frequency|utilisation" -A3 fpga/build/ulx3s-85f/*.log || true

      - uses: actions/upload-artifact@v5
        with:
          name: ulx3s-bitstream
          path: fpga/build/ulx3s-85f/*.bit
          if-no-files-found: warn

  mutate:
    # Slow (every test is broken on purpose and must fail), so it runs on
    # demand and on the default branch rather than on every pull request.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: ./scripts/bootstrap-ubuntu.sh --system
      - run: make mutate
