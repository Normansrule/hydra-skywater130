# Lattice ECP5 Evaluation Board: the dispatcher, crossbar and hardware
# engines. The calibration loop closes on the board with no host in it.
# 12 MHz oscillator from the FTDI device; measured Fmax for this design on
# ECP5-85F is 16-24 MHz depending on toolchain version, so 12 MHz needs no PLL.
core:    hydra_fpga_sys_harness
module:  hydra_ecp5_evn_sys
board:   ecp5-evn
sources:
  - mom/rtl/mom_pkg.sv
  - mom/rtl/mom_features.sv
  - mom/rtl/mom_param_rom.sv
  - mom/rtl/mom_cost_engine.sv
  - mom/rtl/mom_calibrate.sv
  - mom/rtl/mom_select.sv
  - mom/rtl/mom_scoreboard.sv
  - mom/rtl/mom_top.sv
  - mom/rtl/hydra_tt_spi.sv
  - mom/rtl/hydra_tt_regs.sv
  - mom/hydra_mom_pins.sv
  - fpga/rtl/hydra_fpga_uart.sv
  - common/rtl/mom_xbar.sv
  - sys/rtl/hydra_sys_tile.sv
  - fpga/rtl/hydra_fpga_bridge.sv
  - fpga/rtl/hydra_fpga_sys_harness.sv
sys_hz: 12000000        # the board oscillator; well inside the measured Fmax
baud:   115200
clock:  clk
reset:  rst_n
pins:
  - {core: uart_rx_i, board: uart_rx}
  - {core: uart_tx_o, board: uart_tx}
  - {core: "uo_mirror[7:0]", board: "led[7:0]"}
  - {core: "profile[1:0]", board: "dip[1:0]"}
