# Tang Nano 20K (Gowin GW2AR-18): LEDs sink current, hence invert: true.
core:    hydra_fpga_tt_harness
module:  hydra_tangnano20k_tt
board:   tangnano20k
sources:
  - mom/rtl/mom_pkg.sv
  - mom/rtl/mom_features.sv
  - mom/rtl/mom_param_rom.sv
  - mom/rtl/mom_cost_engine.sv
  - mom/rtl/mom_calibrate.sv
  - mom/rtl/mom_select.sv
  - mom/rtl/mom_scoreboard.sv
  - mom/rtl/mom_top.sv
  - mom/rtl/hydra_tt_spi.sv
  - mom/rtl/hydra_tt_regs.sv
  - mom/hydra_mom_pins.sv
  - fpga/rtl/hydra_fpga_uart.sv
  - fpga/rtl/hydra_fpga_bridge.sv
  - fpga/rtl/hydra_fpga_tt_harness.sv
sys_hz: 27000000
baud:   115200
clock:  clk
reset:  rst_n
pins:
  - {core: uart_rx_i, board: uart_rx}
  - {core: uart_tx_o, board: uart_tx}
  - {core: "uo_mirror[5:0]", board: "led[5:0]", invert: true}
