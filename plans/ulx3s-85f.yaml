# ULX3S (ECP5-85F): the TT-A tile driven from a PC over the FTDI serial port.
# 25 MHz oscillator, divided by the PLL to 12.5 MHz; the UART divisor is
# generated from that (109 clocks per bit, -0.45% at 115200 -- see
# scripts/uart_baud.sh). Timing closure is nextpnr's question, and it is
# asked without --timing-allow-fail.
core:    hydra_fpga_tt_harness
module:  hydra_ulx3s_tt
board:   ulx3s-85f
sources:
  - mom/rtl/mom_pkg.sv
  - mom/rtl/mom_features.sv
  - mom/rtl/mom_param_rom.sv
  - mom/rtl/mom_cost_engine.sv
  - mom/rtl/mom_calibrate.sv
  - mom/rtl/mom_select.sv
  - mom/rtl/mom_scoreboard.sv
  - mom/rtl/mom_top.sv
  - mom/rtl/hydra_tt_spi.sv
  - mom/rtl/hydra_tt_regs.sv
  - mom/hydra_mom_pins.sv
  - fpga/rtl/hydra_fpga_uart.sv
  - fpga/rtl/hydra_fpga_bridge.sv
  - fpga/rtl/hydra_fpga_tt_harness.sv
sys_hz: 12500000        # measured Fmax on ECP5-85F is 15.41 MHz (session 179); never ask for more than timing closes at
baud:   115200
clock:  clk
reset:  rst_n
pins:
  - {core: uart_rx_i, board: uart_rx}
  - {core: uart_tx_o, board: uart_tx}
  - {core: "uo_mirror[7:0]", board: "led[7:0]"}
  - {core: "uio_mirror[7:0]", board: "gp[7:0]"}
  - {core: reg_mode_o, board: "gp[8]"}
